<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f4ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="期貨日記">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>期貨淨值日記</title>
<style>
:root {
  color-scheme: light;
  --bg: #f6f4ef;
  --card: #fffefb;
  --card-2: #f3f1ea;
  --ink: #1d1c1a;
  --ink-2: #52514e;
  --muted: #8a887f;
  --line: #e6e3da;
  --grid: #ece9e1;
  --up: #c62828;        /* 台灣習慣：紅＝賺 */
  --up-mark: #e34948;
  --up-soft: #fbe3e1;
  --down: #0f7b3a;      /* 綠＝賠 */
  --down-mark: #1a9a52;
  --down-soft: #dcf1e3;
  --mine: #2a78d6;
  --bench: #eb6834;
  --accent: #2a78d6;
  --accent-ink: #ffffff;
  --gold: #b7791f;
  --water: #4a9be8;
  --shadow: 0 1px 2px rgba(30,28,20,.06), 0 6px 20px rgba(30,28,20,.05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121211; --card: #1a1a19; --card-2: #222220; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #8f8e86;
    --line: #2e2d2a; --grid: #262523; --up: #ff7b72; --up-mark: #e66767; --up-soft: #3a1f1e; --down: #56d18f;
    --down-mark: #2fae6a; --down-soft: #16301f; --mine: #3987e5; --bench: #d95926; --accent: #3987e5; --gold: #e0a84a; --water: #3987e5;
    --shadow: 0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --card: #1a1a19; --card-2: #222220; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #8f8e86;
  --line: #2e2d2a; --grid: #262523; --up: #ff7b72; --up-mark: #e66767; --up-soft: #3a1f1e; --down: #56d18f;
  --down-mark: #2fae6a; --down-soft: #16301f; --mine: #3987e5; --bench: #d95926; --accent: #3987e5; --gold: #e0a84a; --water: #3987e5;
  --shadow: 0 1px 2px rgba(0,0,0,.3);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; scroll-padding-top: 64px; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  font-size: 15px; line-height: 1.55;
}
.num, .tile b, td, .cal-cell { font-variant-numeric: tabular-nums; }
button, input, textarea { font: inherit; color: inherit; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px 80px; }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--ink-2); }
.muted { color: var(--muted); }
h1, h2, h3 { margin: 0; line-height: 1.3; }
h2 { font-size: 18px; }
.eyebrow { font-size: 11px; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; margin: 0 0 2px; }

/* top bar */
.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1080px; margin: 0 auto; padding: 8px 16px; display: flex; align-items: center; gap: 10px; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; white-space: nowrap; }
.brand-logo { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 15px; }
.nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; flex: 1; }
.nav::-webkit-scrollbar { display: none; }
.nav a { text-decoration: none; color: var(--ink-2); font-size: 13px; padding: 5px 10px; border-radius: 999px; white-space: nowrap; }
.nav a:hover { background: var(--card-2); color: var(--ink); }
.icon-btn { border: 1px solid var(--line); background: var(--card); border-radius: 10px; width: 34px; height: 34px; display: grid; place-items: center; cursor: pointer; flex: none; }
.icon-btn:hover { border-color: var(--muted); }

/* banners */
.banner { margin: 12px 0 0; padding: 10px 14px; border-radius: 12px; font-size: 14px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; border: 1px solid var(--line); background: var(--card); }
.banner.warn { border-color: color-mix(in srgb, var(--gold) 45%, var(--line)); background: color-mix(in srgb, var(--gold) 10%, var(--card)); }
.banner .sp { flex: 1; }

/* buttons */
.btn { border: 1px solid var(--line); background: var(--card); padding: 8px 14px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 14px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.big { padding: 12px 20px; font-size: 16px; border-radius: 12px; }
.btn.danger { color: var(--up); }
.btn.small { padding: 4px 10px; font-size: 13px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* cards */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; box-shadow: var(--shadow); margin-top: 16px; }
.card-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.card-head p.sub { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
.foot { font-size: 12.5px; color: var(--muted); margin: 10px 0 0; }
.grid2 { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 16px; }
.grid2 > .card { margin-top: 0; }
.grid2 { margin-top: 16px; }
@media (max-width: 820px) { .grid2 { grid-template-columns: minmax(0,1fr); } }

/* hero */
.hero { display: grid; grid-template-columns: minmax(0,1.1fr) minmax(0,1.4fr); gap: 18px; align-items: center; }
@media (max-width: 760px) { .hero { grid-template-columns: minmax(0,1fr); } }
.hero-eq { font-size: clamp(34px, 8vw, 48px); font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
.hero-eq small { font-size: 16px; font-weight: 600; color: var(--muted); margin-left: 4px; }
.hero-today { margin-top: 6px; font-size: 16px; font-weight: 700; }
.hero-today .muted { font-weight: 400; font-size: 13px; }
.hero-cta { margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
.tile { background: var(--card-2); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.tile span { display: block; font-size: 12.5px; color: var(--ink-2); }
.tile b { display: block; font-size: 20px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile em { font-style: normal; font-size: 12px; color: var(--muted); }
.reminder { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 4px 10px; border-radius: 999px; background: color-mix(in srgb, var(--gold) 15%, transparent); color: var(--gold); font-weight: 600; }
.reminder.done { background: color-mix(in srgb, var(--down) 12%, transparent); color: var(--down); }

/* summary table */
.sum-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; }
@media (max-width: 820px) { .sum-grid { grid-template-columns: minmax(0,1fr); } }
.sum-group h3 { font-size: 13px; color: var(--muted); font-weight: 600; margin: 0 0 6px; }
.sum-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
.sum-row:last-child { border-bottom: 0; }
.sum-row .k { color: var(--ink-2); display: flex; align-items: center; gap: 4px; }
.sum-row .k small { color: var(--muted); font-size: 11px; }
.sum-row .v { font-weight: 700; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.q { border: 0; background: var(--card-2); color: var(--muted); width: 17px; height: 17px; border-radius: 50%; font-size: 11px; line-height: 17px; padding: 0; cursor: help; flex: none; }
.explain { font-size: 12.5px; color: var(--ink-2); background: var(--card-2); border-radius: 8px; padding: 6px 10px; margin: 0 0 6px; }
.tips { margin: 14px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.tips li { font-size: 14px; padding: 8px 12px; border-radius: 10px; background: var(--card-2); display: flex; gap: 8px; }

/* charts */
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); }
.legend i { display: inline-block; width: 18px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 6px; }
.legend i.dash { border-top-style: dashed; }
.legend i.box { width: 10px; height: 10px; border: 0; border-radius: 3px; }
.chart { position: relative; width: 100%; margin-top: 8px; touch-action: pan-y; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart svg:focus { outline: none; }
.chart svg:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 6px; }
.chart .axis { fill: var(--muted); font-size: 11px; }
.chart .gridl { stroke: var(--grid); stroke-width: 1; }
.chart .zerol { stroke: var(--muted); stroke-width: 1; opacity: .6; }
.chart .refl { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
.chart .reft { fill: var(--muted); font-size: 11px; }
.tip { position: absolute; pointer-events: none; z-index: 5; background: var(--card); border: 1px solid var(--line); box-shadow: 0 6px 24px rgba(0,0,0,.12); border-radius: 10px; padding: 8px 10px; font-size: 12.5px; min-width: 140px; opacity: 0; transition: opacity .12s; }
.tip.show { opacity: 1; }
.tip .t-date { font-weight: 700; margin-bottom: 4px; }
.tip .t-row { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.tip .t-row span:first-child { color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.tip .sw { width: 10px; height: 3px; border-radius: 2px; display: inline-block; }
.tip b { font-variant-numeric: tabular-nums; }
.seg { display: inline-flex; background: var(--card-2); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 4px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.chart-stats { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); }
.chart-stats b { color: var(--ink); }

/* win rate */
.wr { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 4px; }
@media (max-width: 520px) { .wr { grid-template-columns: 1fr; } }
.wr-box { background: var(--card-2); border-radius: 12px; padding: 12px; }
.wr-box .big { font-size: 26px; font-weight: 800; }
.wr-box .lbl { font-size: 12.5px; color: var(--ink-2); }
.wr-bar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; gap: 2px; margin: 8px 0 6px; background: var(--card); }
.wr-bar div { height: 100%; }
.wr-cap { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-2); }
.pay-row { display: grid; grid-template-columns: 52px 1fr auto; align-items: center; gap: 8px; font-size: 12.5px; margin-top: 6px; }
.pay-track { height: 10px; background: var(--card); border-radius: 5px; overflow: hidden; }
.pay-track div { height: 100%; border-radius: 0 4px 4px 0; }

/* calendar */
.cal-nav { display: flex; align-items: center; gap: 8px; }
.cal-nav strong { min-width: 96px; text-align: center; font-size: 16px; }
.cal-sum { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); margin: 4px 0 10px; }
.cal-sum b { color: var(--ink); }
.cal { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)) minmax(0,.9fr); gap: 4px; }
.cal-h { font-size: 12px; color: var(--muted); text-align: center; padding: 2px 0; }
.cal-cell { min-height: 64px; border-radius: 10px; padding: 5px 6px; background: var(--card-2); display: flex; flex-direction: column; gap: 1px; font-size: 12px; position: relative; min-width: 0; overflow: hidden; }
.cal-cell.out { background: transparent; }
.cal-cell.empty .d { color: var(--muted); }
.cal-cell .d { font-size: 11px; color: var(--ink-2); }
.cal-cell .p { font-weight: 700; font-size: 13px; white-space: nowrap; }
.cal-cell .r { font-size: 11px; opacity: .85; white-space: nowrap; }
.cal-cell .c { font-size: 10.5px; color: var(--gold); white-space: nowrap; }
.cal-cell.today { box-shadow: inset 0 0 0 2px var(--accent); }
.cal-cell.week { background: transparent; border: 1px dashed var(--line); }
.cal-cell button.cell-btn { all: unset; position: absolute; inset: 0; cursor: pointer; border-radius: 10px; }
.cal-cell button.cell-btn:focus-visible { outline: 2px solid var(--accent); }
.cal-legend { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-top: 10px; flex-wrap: wrap; }
.cal-legend span.sq { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }

/* leak bucket */
.leak { display: grid; grid-template-columns: 170px 1fr; gap: 18px; align-items: center; }
@media (max-width: 600px) { .leak { grid-template-columns: 1fr; justify-items: center; } }
.bucket svg { width: 160px; height: auto; display: block; }
.drop { animation: drip 2.2s infinite ease-in; opacity: 0; }
.drop.d2 { animation-delay: .7s; } .drop.d3 { animation-delay: 1.4s; }
@keyframes drip { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(46px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .drop { animation: none; opacity: 1; } html { scroll-behavior: auto; } }
.leak-eq { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: var(--card-2); border-radius: 12px; padding: 10px 12px; font-size: 14px; margin-top: 10px; }
.leak-eq .op { color: var(--muted); font-weight: 700; }
.leak-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
@media (max-width: 520px) { .leak-tiles { grid-template-columns: 1fr 1fr; } }
.leak-tiles .tile b { font-size: 18px; }

/* table */
.tbl-wrap { overflow-x: auto; margin: 0 -4px; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: right; font-weight: 600; color: var(--muted); font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { text-align: right; padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
td.note { text-align: left; white-space: normal; min-width: 160px; max-width: 260px; color: var(--ink-2); font-size: 12.5px; }

/* empty / onboarding */
.onboard { text-align: center; padding: 34px 18px; }
.onboard .emoji { font-size: 44px; }
.onboard h2 { font-size: 22px; margin: 8px 0 6px; }
.onboard p { color: var(--ink-2); max-width: 520px; margin: 0 auto 16px; }
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 640px; margin: 18px auto 0; text-align: left; }
@media (max-width: 600px) { .steps { grid-template-columns: 1fr; } }
.steps div { background: var(--card-2); border-radius: 12px; padding: 10px 12px; font-size: 13.5px; }
.steps b { display: block; margin-bottom: 2px; }

/* dialog */
dialog { border: 0; border-radius: 18px; padding: 0; width: min(460px, calc(100vw - 24px)); background: var(--card); color: var(--ink); box-shadow: 0 20px 60px rgba(0,0,0,.25); }
dialog::backdrop { background: rgba(10,10,8,.45); }
.dlg { padding: 20px; max-height: calc(100dvh - 40px); overflow-y: auto; }
.dlg h2 { font-size: 20px; }
.dlg .sub { color: var(--muted); font-size: 13px; margin: 2px 0 14px; }
.field { display: grid; gap: 4px; margin-bottom: 12px; }
.field > span { font-size: 13.5px; font-weight: 600; }
.field > span small { font-weight: 400; color: var(--muted); }
.field input, .field textarea { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 16px; }
.field input:focus, .field textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
.field input.huge { font-size: 26px; font-weight: 800; padding: 10px 12px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.flow-seg { display: flex; gap: 6px; margin-bottom: 6px; }
.flow-seg button { flex: 1; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 7px; cursor: pointer; font-size: 13.5px; }
.flow-seg button[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--bg)); font-weight: 700; }
.preview { background: var(--card-2); border-radius: 12px; padding: 10px 12px; font-size: 14px; margin-bottom: 14px; }
.preview b { font-size: 18px; }
.dlg-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.dlg-actions .sp { flex: 1; }
details.more summary { cursor: pointer; font-size: 13.5px; color: var(--ink-2); margin-bottom: 10px; }
.err { color: var(--up); font-size: 13px; min-height: 1em; margin: 0 0 8px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 600; opacity: 0; transition: .25s; z-index: 50; pointer-events: none; max-width: calc(100vw - 32px); }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.set-list { display: grid; gap: 8px; }
.set-list .btn { text-align: left; }
.hidden { display: none !important; }

/* ---------- 手機版：底部分頁、單張圖表、卡片式紀錄、底部滑出輸入 ---------- */
.dlg-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.date-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.date-chips { display: flex; gap: 6px; }
.date-chips button, .chips button { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 7px 14px; font-size: 14px; cursor: pointer; white-space: nowrap; color: var(--ink-2); }
.date-chips button[aria-pressed="true"], .chips button[aria-selected="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--card)); color: var(--ink); font-weight: 700; }
.date-row input[type=date] { flex: 1; min-width: 140px; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 7px 10px; font-size: 16px; }
.dlg-actions.sticky { position: sticky; bottom: 0; background: var(--card); padding: 12px 0 14px; margin-top: 4px; }
.sum-group > summary { list-style: none; }
.sum-group > summary::-webkit-details-marker { display: none; }
.sum-group > summary .peek { display: none; }
body:not(.m) .sum-group > summary { pointer-events: none; }
.tabbar, .chips, .log-cards { display: none; }
.lc-month { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-2); padding: 10px 2px 0; }
.log-card { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 50px 1fr 12px; column-gap: 10px; row-gap: 2px; align-items: center; background: var(--card-2); border-radius: 12px; padding: 10px 12px; cursor: pointer; width: 100%; -webkit-tap-highlight-color: transparent; }
.log-card:active { transform: scale(.99); }
.log-card:focus-visible { outline: 2px solid var(--accent); }
.lc-date { grid-row: 1 / span 2; font-weight: 700; font-size: 16px; display: flex; flex-direction: column; line-height: 1.2; }
.lc-date small { font-weight: 400; color: var(--muted); font-size: 12px; }
.lc-main { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-variant-numeric: tabular-nums; }
.lc-main b { font-size: 17px; }
.lc-main small { font-size: 13px; font-weight: 600; }
.lc-eq { font-size: 12.5px; color: var(--ink-2); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; grid-column: 2; font-variant-numeric: tabular-nums; }
.lc-tag { background: var(--card); border-radius: 999px; padding: 0 8px; font-size: 11.5px; }
.lc-note { grid-column: 2 / 4; font-size: 13px; color: var(--ink-2); margin-top: 2px; }
.lc-go { grid-column: 3; grid-row: 1 / span 2; color: var(--muted); font-size: 20px; }
@keyframes sheetUp { from { transform: translateY(60px); opacity: .4; } to { transform: none; opacity: 1; } }
@media (max-width: 760px) {
  body { font-size: 15.5px; }
  .nav { display: none; }
  .brand { flex: 1; min-width: 0; }
  .brand span:last-child { overflow: hidden; text-overflow: ellipsis; }
  body.m [data-tab]:not(.tab-on) { display: none !important; }
  body.m [data-chart]:not(.chart-on) { display: none !important; }
  body.m .wrap { padding-bottom: calc(100px + env(safe-area-inset-bottom)); }

<script>
(() => {
'use strict';
const KEY = 'futures-nav-diary.v1';
const BENCH_KEY = 'futures-nav-diary.bench.v1';
const THEME_KEY = 'futures-nav-diary.theme';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- storage ---------- */
let storageOk = true;
function load(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { storageOk = false; return fallback; }
}
function save(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); return true; } catch (e) { storageOk = false; return false; }
}
const defaultState = () => ({ settings: { name: '', capital: 22000 }, records: [], lastBackup: null });
let state = Object.assign(defaultState(), load(KEY, {}));
state.settings = Object.assign(defaultState().settings, state.settings || {});
state.records = Array.isArray(state.records) ? state.records : [];
let bench = Object.assign({ closes: {}, months: {} }, load(BENCH_KEY, {}));
let demo = null;            // 範例資料只放記憶體，不會存起來
let benchStatus = 'idle';   // idle | loading | ok | fail
const persist = () => save(KEY, state);
const view = () => demo || state;

/* ---------- formatting ---------- */
const nf0 = new Intl.NumberFormat('zh-TW', { maximumFractionDigits: 0 });
const money = v => v == null || !isFinite(v) ? '—' : nf0.format(Math.round(v) || 0);
const sMoney = v => v == null || !isFinite(v) ? '—' : (v > 0 ? '+' : v < 0 ? '−' : '') + nf0.format(Math.abs(Math.round(v)));
const pct = (v, d = 2) => v == null || !isFinite(v) ? '—' : (v * 100).toFixed(d) + '%';
const sPct = (v, d = 2) => { if (v == null || !isFinite(v)) return '—'; const t = Math.abs(v * 100).toFixed(d); return (+t === 0 ? '' : v > 0 ? '+' : '−') + t + '%'; };
const arrow = v => v > 0 ? '▲' : v < 0 ? '▼' : '';
const tone = v => v == null || !isFinite(v) ? 'flat' : v > 0 ? 'up' : v < 0 ? 'down' : 'flat';
const compact = v => {
  const a = Math.abs(v), s = v > 0 ? '+' : v < 0 ? '−' : '';
  return a >= 10000 ? s + (a / 10000).toFixed(a >= 100000 ? 0 : 1) + '萬' : s + nf0.format(Math.round(a));
};
const ratio = v => v == null || !isFinite(v) ? '—' : v.toFixed(2);
const pad = n => String(n).padStart(2, '0');
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const md = iso => `${+iso.slice(5, 7)}/${+iso.slice(8, 10)}`;
const WEEK = ['日', '一', '二', '三', '四', '五', '六'];
const wd = iso => WEEK[new Date(iso + 'T00:00').getDay()];
const todayIso = () => isoOf(new Date());

/* ---------- core math ---------- */
function compute(st) {
  const capital = Number(st.settings.capital) || 0;
  const recs = st.records.slice().sort((a, b) => a.date.localeCompare(b.date));
  const closes = bench.closes;
  const benchDates = Object.keys(closes).sort();
  const closeOn = iso => { // 該日（含）以前最近一個收盤
    let lo = 0, hi = benchDates.length - 1, ans = null;
    while (lo <= hi) { const m = (lo + hi) >> 1; if (benchDates[m] <= iso) { ans = benchDates[m]; lo = m + 1; } else hi = m - 1; }
    return ans ? { date: ans, close: closes[ans] } : null;
  };
  const closeBefore = iso => {
    let ans = null; for (let i = benchDates.length - 1; i >= 0; i--) if (benchDates[i] < iso) { ans = benchDates[i]; break; }
    return ans ? { date: ans, close: closes[ans] } : null;
  };
  const benchBase = recs.length ? closeBefore(recs[0].date) : null;
  let prevEq = capital, idx = 1, peakIdx = 1, cumPnl = 0, peakPnl = 0, cumFlow = 0;
  let bIdxPeak = 1, prevBench = benchBase;
  const rows = recs.map(r => {
    const flow = Number(r.flow) || 0;
    const base = prevEq + flow;
    const pnl = r.equity - prevEq - flow;
    const ret = base > 0 ? pnl / base : 0;
    idx *= 1 + ret; peakIdx = Math.max(peakIdx, idx);
    cumPnl += pnl; peakPnl = Math.max(peakPnl, cumPnl); cumFlow += flow;
    const cost = Number(r.cost) || 0;
    let bClose = null, bCum = null, bRet = null, bDd = null;
    const bc = closeOn(r.date);
    if (benchBase && bc && bc.date >= benchBase.date) {
      bClose = bc.close; bCum = bc.close / benchBase.close - 1;
      const bi = 1 + bCum; bIdxPeak = Math.max(bIdxPeak, bi); bDd = bi / bIdxPeak - 1;
      bRet = prevBench ? bc.close / prevBench.close - 1 : null; prevBench = bc;
    }
    const row = {
      date: r.date, equity: r.equity, flow, pnl, ret, cost, gross: pnl + cost, lots: Number(r.lots) || 0, note: r.note || '',
      cum: idx - 1, dd: idx / peakIdx - 1, cumPnl, ddMoney: cumPnl - peakPnl, cumFlow,
      bClose, bCum, bRet, bDd, benchDate: bc ? bc.date : null
    };
    prevEq = r.equity;
    return row;
  });
  // summary
  const wins = rows.filter(r => r.pnl > 0), losses = rows.filter(r => r.pnl < 0), flats = rows.filter(r => r.pnl === 0);
  const totalProfit = wins.reduce((s, r) => s + r.pnl, 0), totalLoss = losses.reduce((s, r) => s + r.pnl, 0);
  const decided = wins.length + losses.length;
  const avgWin = wins.length ? totalProfit / wins.length : null, avgLoss = losses.length ? totalLoss / losses.length : null;
  const last = rows[rows.length - 1] || null;
  let maxDd = 0, maxDdMoney = 0, maxDdDate = null;
  rows.forEach(r => { if (r.dd < maxDd) { maxDd = r.dd; maxDdDate = r.date; } if (r.ddMoney < maxDdMoney) maxDdMoney = r.ddMoney; });
  let best = null, worst = null;
  rows.forEach(r => { if (!best || r.pnl > best.pnl) best = r; if (!worst || r.pnl < worst.pnl) worst = r; });
  // streaks
  let curKind = 0, cur = 0, maxW = 0, maxL = 0, run = 0, runKind = 0;
  rows.forEach(r => {
    const k = Math.sign(r.pnl);
    if (k === 0) { run = 0; runKind = 0; return; }
    if (k === runKind) run++; else { run = 1; runKind = k; }
    if (k > 0) maxW = Math.max(maxW, run); else maxL = Math.max(maxL, run);
  });
  curKind = runKind; cur = run;
  // highs
  let newHighs = 0, hi = capital; rows.forEach(r => { if (r.dd === 0 && r.pnl > 0) newHighs++; });
  const totalCost = rows.reduce((s, r) => s + r.cost, 0), totalLots = rows.reduce((s, r) => s + r.lots, 0);
  const deposits = rows.reduce((s, r) => s + Math.max(0, r.flow), 0), withdrawals = rows.reduce((s, r) => s + Math.min(0, r.flow), 0);
  const netPnl = last ? last.cumPnl : 0;
  const grossPnl = netPnl + totalCost;
  const vol = (() => { if (rows.length < 2) return null; const m = rows.reduce((s, r) => s + r.ret, 0) / rows.length; return Math.sqrt(rows.reduce((s, r) => s + (r.ret - m) ** 2, 0) / (rows.length - 1)); })();
  return {
    capital, rows, last, benchBase,
    s: {
      days: rows.length, winDays: wins.length, lossDays: losses.length, flatDays: flats.length,
      winRate: decided ? wins.length / decided : null, totalProfit, totalLoss,
      profitFactor: totalLoss < 0 ? totalProfit / -totalLoss : (totalProfit > 0 ? Infinity : null),
      avgWin, avgLoss, payoff: avgWin != null && avgLoss != null ? avgWin / -avgLoss : null,
      avgDaily: rows.length ? netPnl / rows.length : null, netPnl, grossPnl, cum: last ? last.cum : 0,
      benchCum: last ? last.bCum : null, maxDd, maxDdMoney, maxDdDate, curDd: last ? last.dd : 0, curDdMoney: last ? last.ddMoney : 0,
      retOverDd: maxDd < 0 && last ? last.cum / -maxDd : null, best, worst, curKind, cur, maxW, maxL, newHighs,
      totalCost, totalLots, costPerLot: totalLots ? totalCost / totalLots : null, deposits, withdrawals, vol,
      costShare: grossPnl > 0 ? totalCost / grossPnl : null, costOfCapital: capital ? totalCost / capital : null
    }
  };
}

/* ---------- 大盤（證交所加權指數，自動抓） ---------- */
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function syncBench() {
  const recs = view().records;
  if (!recs.length) return;
  const first = recs.map(r => r.date).sort()[0];
  const start = new Date(first + 'T00:00'); start.setDate(start.getDate() - 20);
  const end = new Date();
  const curYm = `${end.getFullYear()}${pad(end.getMonth() + 1)}`;
  const months = [];
  for (let d = new Date(start.getFullYear(), start.getMonth(), 1); d <= end; d.setMonth(d.getMonth() + 1)) months.push(`${d.getFullYear()}${pad(d.getMonth() + 1)}`);
  const todo = months.filter(ym => {
    const m = bench.months[ym];
    if (!m) return true;
    if (ym < curYm && m.final) return false;
    return Date.now() - (m.at || 0) > 20 * 60 * 1000;
  });
  if (!todo.length) { benchStatus = 'ok'; return; }
  benchStatus = 'loading'; renderBenchNote();
  let changed = false, failed = false;
  for (const ym of todo) {
    try {
      const res = await fetch(`https://www.twse.com.tw/rwd/zh/afterTrading/FMTQIK?date=${ym}01&response=json`, { cache: 'no-store' });
      const j = await res.json();
      if (j.stat === 'OK' && Array.isArray(j.data)) {
        j.data.forEach(row => {
          const [y, m, d] = String(row[0]).split('/');
          const close = parseFloat(String(row[4]).replace(/,/g, ''));
          if (isFinite(close)) bench.closes[`${+y + 1911}-${pad(m)}-${pad(d)}`] = close;
        });
      }
      bench.months[ym] = { at: Date.now(), final: ym < curYm };
      changed = true;
    } catch (e) { failed = true; }
    await sleep(350);
  }
  benchStatus = failed && !Object.keys(bench.closes).length ? 'fail' : (failed ? 'partial' : 'ok');
  if (changed) { save(BENCH_KEY, bench); render(); } else renderBenchNote();
}

/* ---------- charts（手刻 SVG，含滑鼠/手指十字線） ---------- */
function niceTicks(min, max, n = 4) {
  if (!isFinite(min) || !isFinite(max)) { min = 0; max = 1; }
  if (min === max) { const p = Math.abs(min) * 0.05 || 1; min -= p; max += p; }
  const step0 = (max - min) / n, mag = 10 ** Math.floor(Math.log10(step0)), e = step0 / mag;
  const step = (e >= 7.5 ? 10 : e >= 3.5 ? 5 : e >= 1.5 ? 2 : 1) * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, ticks = [];
  for (let v = lo; v <= hi + step / 2; v += step) ticks.push(+v.toFixed(10));
  return { lo, hi, ticks };
}
function xLabelIdx(n, w) {
  const want = Math.max(2, Math.min(n, Math.floor(w / 70)));
  if (n <= want) return [...Array(n).keys()];
  const out = new Set([0, n - 1]);
  for (let k = 1; k < want - 1; k++) out.add(Math.round(k * (n - 1) / (want - 1)));
  return [...out].sort((a, b) => a - b);
}
/**
 * o = { labels:[iso|'起點'], series:[{name,color,values,dashed,area}], bars:{values,colorOf}, fmt, height, zero, refs:[{v,label}], tip:(i)=>html, aria }
 */
function chart(host, o) {
  host.innerHTML = '';
  const W = Math.max(260, host.clientWidth || 600), H = o.height || 220;
  const fmt = o.fmt || money;
  const vals = [];
  (o.series || []).forEach(s => s.values.forEach(v => v != null && isFinite(v) && vals.push(v)));
  if (o.bars) o.bars.values.forEach(v => v != null && isFinite(v) && vals.push(v));
  (o.refs || []).forEach(r => vals.push(r.v));
  if (o.zero || o.bars) vals.push(0);
  let min = Math.min(...vals), max = Math.max(...vals);
  const { lo, hi, ticks } = niceTicks(min, max, H < 200 ? 3 : 4);
  const labelW = Math.max(...ticks.map(t => fmt(t).length)) * 6.6 + 10;
  const padL = Math.max(40, labelW), padR = 14, padT = 10, padB = 24;
  const n = o.labels.length, iw = W - padL - padR, ih = H - padT - padB;
  const band = o.bars ? iw / n : 0;
  const x = i => o.bars ? padL + band * (i + 0.5) : padL + (n === 1 ? iw / 2 : i * iw / (n - 1));

  if (lo < 0 && hi > 0) g += `<line class="zerol" x1="${padL}" x2="${W - padR}" y1="${y(0)}" y2="${y(0)}"/>`;
  (o.refs || []).forEach(r => { g += `<line class="refl" x1="${padL}" x2="${W - padR}" y1="${y(r.v)}" y2="${y(r.v)}"/><text class="reft" x="${W - padR}" y="${y(r.v) - 5}" text-anchor="end">${esc(r.label)}</text>`; });
  xLabelIdx(n, iw).forEach(i => {
    const l = o.labels[i]; const t = l.length === 10 ? md(l) : l;
    const anchor = o.bars ? 'middle' : i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle';
    g += `<text class="axis" x="${x(i)}" y="${H - 6}" text-anchor="${anchor}">${esc(t)}</text>`;
  });
  if (o.bars) {
    const bw = Math.max(2, Math.min(22, band * 0.68)), r = Math.min(4, bw / 2), base = y(Math.max(lo, Math.min(0, hi)));
    o.bars.values.forEach((v, i) => {
      if (v == null || !isFinite(v) || v === 0) return;
      const x0 = x(i) - bw / 2, yv = y(v), h = Math.abs(yv - base);

        : `M${x0},${base}V${yv - rr}Q${x0},${yv} ${x0 + rr},${yv}H${x0 + bw - rr}Q${x0 + bw},${yv} ${x0 + bw},${yv - rr}V${base}Z`;

  (o.series || []).forEach(s => {
    let d = '', pen = false; const pts = [];

      g += `<path d="${a}" fill="${s.color}" opacity="${s.areaOpacity || 0.12}"/>`;

    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"${s.dashed ? ' stroke-dasharray="6 4"' : ''}/>`;
    if (s.dots) pts.forEach(i => { g += `<circle cx="${x(i)}" cy="${y(s.values[i])}" r="3" fill="${s.dotColor ? s.dotColor(s.values[i]) : s.color}" stroke="var(--card)" stroke-width="1.5"/>`; });
    if (pts.length && !s.dashed) { const i = pts[pts.length - 1]; g += `<circle cx="${x(i)}" cy="${y(s.values[i])}" r="4" fill="${s.color}" stroke="var(--card)" stroke-width="2"/>`; }
  });
  g += `<g class="hover" style="display:none"><line class="hl" x1="0" x2="0" y1="${padT}" y2="${padT + ih}" stroke="var(--muted)" stroke-width="1"/>`;
  (o.series || []).forEach((s, k) => { g += `<circle class="hd" data-k="${k}" r="5" fill="${s.color}" stroke="var(--card)" stroke-width="2"/>`; });
  g += `</g><rect x="${padL}" y="0" width="${iw}" height="${H}" fill="transparent"/>`;
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" tabindex="0" aria-label="${esc(o.aria || '')}">${g}</svg><div class="tip"></div>`;
  const svg = host.querySelector('svg'), tip = host.querySelector('.tip'), hov = svg.querySelector('.hover'), hl = svg.querySelector('.hl');
  let cur = -1;
  const show = i => {

  const idxAt = ev => {

}

  if (s.worst && s.worst.pnl < 0 && C.capital && -s.worst.pnl / C.capital > 0.1) out.push(['📉', `最大單日虧損 ${sMoney(s.worst.pnl)} 超過本金 10%，單日停損可以設緊一點。`]);

function compactAxis(v) { const a = Math.abs(v); return a >= 10000 ? (v / 10000).toFixed(a % 10000 ? 1 : 0) + '萬' : nf0.format(v); }

/* ---------- events ---------- */
function setTab(t) { curTab = t; render(); window.scrollTo(0, 0); }
function wire() {
  document.querySelectorAll('[data-chart-btn]').forEach(b => b.onclick = () => { curChart = b.dataset.chartBtn; render(); const c = document.querySelector(`[data-chart-btn="${curChart}"]`); if (c) c.scrollIntoView({ inline: 'center', block: 'nearest' }); window.scrollTo(0, 0); });
  document.querySelectorAll('.sum-group').forEach(d => d.addEventListener('toggle', () => { if (!isM()) return; if (d.open) sumOpen.add(+d.dataset.grp); else sumOpen.delete(+d.dataset.grp); }));
  const cal = document.querySelector('.cal');
  if (cal) {
    let sx = null, sy = 0;
    cal.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
    cal.addEventListener('touchend', e => {
      if (sx == null) return; const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) { const b = document.querySelector(`[data-cal="${dx < 0 ? 1 : -1}"]`); if (b && !b.disabled) b.click(); }
    });
  }
  document.querySelectorAll('[data-act]').forEach(b => b.onclick = () => {
    const a = b.dataset.act;
    if (a === 'entry') openEntry();
    if (a === 'demo') { demo = makeDemo(); calMonth = null; render(); syncBench(); window.scrollTo({ top: 0 }); }
    if (a === 'exitDemo') { demo = null; calMonth = null; history.replaceState(null, '', location.pathname); render(); }
    if (a === 'export') exportJson();
    if (a === 'toggleLog') { showAllLog = !showAllLog; render(); }
  });
  document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openEntry(b.dataset.edit));
  document.querySelectorAll('[data-cal]').forEach(b => b.onclick = () => {
    const months = [...new Set(view().records.map(r => r.date.slice(0, 7)))].sort();
    const i = months.indexOf(calMonth) + Number(b.dataset.cal);
    if (months[i]) { calMonth = months[i]; const sec = $('#sec-calendar'); sec.innerHTML = calendarHtml(compute(view())); wire(); }
  });
  document.querySelectorAll('[data-daily]').forEach(b => b.onclick = () => { dailyMode = b.dataset.daily; render(); });
  document.querySelectorAll('[data-explain]').forEach(b => b.onclick = () => {
    openExplain = openExplain === b.dataset.explain ? null : b.dataset.explain;
    const y = window.scrollY; const sec = $('#sec-summary'); sec.outerHTML = summaryHtml(compute(view())); wire(); window.scrollTo(0, y);
  });
}

/* ---------- entry dialog ---------- */
const dlg = $('#entryDlg');
let flowKind = 'none', editing = null;
function prevEquityBefore(iso) {
  const st = view();
  const prev = st.records.filter(r => r.date < iso).sort((a, b) => b.date.localeCompare(a.date))[0];
  return prev ? prev.equity : Number(st.settings.capital) || 0;
}
function setFlow(kind) {
  flowKind = kind;
  dlg.querySelectorAll('[data-flow]').forEach(b => b.setAttribute('aria-pressed', b.dataset.flow === kind));
  $('#fFlow').classList.toggle('hidden', kind === 'none');
  updatePreview();
}
function openEntry(iso) {
  if (demo) { toast('範例模式不能修改，先按「清除範例」開始記自己的'); return; }
  const date = iso || todayIso();
  fillEntry(date);
  $('#fErr').textContent = '';
  dlg.showModal();
  setTimeout(() => $('#fEquity').focus(), 50);
}
function fillEntry(date) {
  const r = state.records.find(x => x.date === date);
  editing = r ? date : null;
  $('#entryTitle').textContent = r ? `修改 ${md(date)} 的紀錄` : '記錄今天';
  $('#fDate').value = date;
  $('#fEquity').value = r ? r.equity : '';
  const f = r ? Number(r.flow) || 0 : 0;
  $('#fFlow').value = f ? Math.abs(f) : '';
  $('#fCost').value = r && r.cost ? r.cost : '';
  $('#fLots').value = r && r.lots ? r.lots : '';
  $('#fNote').value = r ? r.note || '' : '';
  $('#fMore').open = !!(r && (r.cost || r.lots || r.note));
  $('#fDelete').classList.toggle('hidden', !r);
  setFlow(f > 0 ? 'in' : f < 0 ? 'out' : 'none');
}
function readFlow() { const v = Number($('#fFlow').value) || 0; return flowKind === 'in' ? v : flowKind === 'out' ? -v : 0; }
function updatePreview() {
  const eq = Number($('#fEquity').value), date = $('#fDate').value;
  syncDateChips();
  if (date) { const pr = view().records.filter(r => r.date < date).sort((a, b) => b.date.localeCompare(a.date))[0]; $('#fLastHint').textContent = pr ? `　上一筆 ${money(pr.equity)}（${md(pr.date)}）` : `　本金 ${money(view().settings.capital)}`; }
  const p = $('#fPreview');
  if (!$('#fEquity').value || !isFinite(eq) || !date) { p.innerHTML = '輸入權益總值後，這裡會算出今天的損益。'; return; }
  const prev = prevEquityBefore(date), flow = readFlow(), pnl = eq - prev - flow, base = prev + flow;
  const ret = base > 0 ? pnl / base : 0;
  p.innerHTML = `今天損益 <b class="${tone(pnl)}">${arrow(pnl)} ${sMoney(pnl)} 元（${sPct(ret)}）</b><br><span class="muted" style="font-size:12.5px">＝ ${money(eq)} − 前一筆 ${money(prev)}${flow ? ` − ${flow > 0 ? '入金' : '出金'} ${sMoney(flow)}` : ''}</span>` +
    (Math.abs(ret) > 0.5 ? `<br><span class="up" style="font-size:12.5px">⚠️ 變動超過 50%，確認一下有沒有打錯、或忘了填入出金？</span>` : '');
}
['#fEquity', '#fFlow', '#fDate'].forEach(s => $(s).addEventListener('input', updatePreview));
$('#fDate').addEventListener('change', () => { const d = $('#fDate').value; if (d && state.records.some(r => r.date === d) && d !== editing) fillEntry(d); else updatePreview(); });
dlg.querySelectorAll('[data-flow]').forEach(b => b.addEventListener('click', () => { setFlow(b.dataset.flow); if (b.dataset.flow !== 'none') $('#fFlow').focus(); }));
$('#fCancel').onclick = () => dlg.close();
$('#fClose').onclick = () => dlg.close();
function prevTradingDay() { const d = new Date(); do { d.setDate(d.getDate() - 1); } while (d.getDay() === 0 || d.getDay() === 6); return isoOf(d); }
function syncDateChips() { const v = $('#fDate').value; dlg.querySelectorAll('[data-day]').forEach(b => b.setAttribute('aria-pressed', (b.dataset.day === 'today' ? todayIso() : prevTradingDay()) === v)); }
dlg.querySelectorAll('[data-day]').forEach(b => b.addEventListener('click', () => { const f = $('#fDate'); f.value = b.dataset.day === 'today' ? todayIso() : prevTradingDay(); f.dispatchEvent(new Event('change')); }));
let delArmed = false;
$('#fDelete').onclick = () => {
  if (!delArmed) { delArmed = true; $('#fDelete').textContent = '再按一次確認刪除'; setTimeout(() => { delArmed = false; $('#fDelete').textContent = '刪除這天'; }, 3000); return; }
  state.records = state.records.filter(r => r.date !== editing); persist(); delArmed = false; $('#fDelete').textContent = '刪除這天';
  dlg.close(); render(); toast('已刪除');
};
$('#entryForm').addEventListener('submit', ev => {
  ev.preventDefault();
  const date = $('#fDate').value, eq = Number($('#fEquity').value);
  if (!date) return ($('#fErr').textContent = '請選日期');
  if (!$('#fEquity').value || !isFinite(eq) || eq < 0) return ($('#fErr').textContent = '請輸入權益總值（APP 上的數字）');
  if (flowKind !== 'none' && !(Number($('#fFlow').value) > 0)) return ($('#fErr').textContent = '請輸入入金／出金的金額，或選「沒有」');
  const rec = { date, equity: Math.round(eq * 100) / 100, flow: readFlow(), cost: Number($('#fCost').value) || 0, lots: Number($('#fLots').value) || 0, note: $('#fNote').value.trim() };
  state.records = state.records.filter(r => r.date !== date && r.date !== editing).concat(rec).sort((a, b) => a.date.localeCompare(b.date));
  persist(); dlg.close();
  calMonth = date.slice(0, 7);
  if (isM()) { curTab = 'home'; window.scrollTo(0, 0); }
  render(); syncBench();
  const row = compute(state).rows.find(r => r.date === date);
  toast(row ? `已記錄！${md(date)} ${arrow(row.pnl)} ${sMoney(row.pnl)} 元（${sPct(row.ret)}）` : '已記錄');
});

/* ---------- settings / backup ---------- */
const setDlg = $('#setDlg');
$('#setBtn').onclick = () => { $('#sName').value = state.settings.name || ''; $('#sCapital').value = state.settings.capital; $('#sErr').textContent = ''; setDlg.showModal(); };
$('#sClose').onclick = () => setDlg.close();
$('#setForm').addEventListener('submit', ev => {
  ev.preventDefault();
  const cap = Number($('#sCapital').value);
  if (!(cap > 0)) return ($('#sErr').textContent = '本金要大於 0');
  state.settings.name = $('#sName').value.trim(); state.settings.capital = cap; persist();
  setDlg.close(); render(); toast('設定已儲存');
});
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function exportJson() {
  if (demo) { toast('範例資料不用備份'); return; }
  download(`期貨日記備份_${todayIso()}.json`, JSON.stringify({ app: 'futures-nav-diary', version: 1, exportedAt: new Date().toISOString(), settings: state.settings, records: state.records }, null, 2), 'application/json');
  state.lastBackup = Date.now(); persist(); render(); toast('備份檔已下載，傳到 LINE 或雲端存好');
}
$('#bExport').onclick = exportJson;
$('#bCsv').onclick = () => {
  const C = compute(state);
  const head = ['日期', '權益總值', '出入金', '當日損益', '當日報酬率%', '累積報酬率%', '回撤%', '手續費+稅', '口數', '加權指數', '心得'];
  const lines = C.rows.map(r => [r.date, r.equity, r.flow, Math.round(r.pnl), (r.ret * 100).toFixed(2), (r.cum * 100).toFixed(2), (r.dd * 100).toFixed(2), r.cost, r.lots, r.bClose ?? '', `"${(r.note || '').replace(/"/g, '""')}"`].join(','));
  download(`期貨日記_${todayIso()}.csv`, '﻿' + [head.join(','), ...lines].join('\r\n'), 'text/csv');
};
$('#bImport').onclick = () => $('#importFile').click();
$('#importFile').addEventListener('change', async ev => {
  const f = ev.target.files[0]; if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    if (!Array.isArray(j.records) || !j.records.every(r => /^\d{4}-\d{2}-\d{2}$/.test(r.date) && isFinite(Number(r.equity)))) throw new Error('格式不對');
    state = { settings: Object.assign(defaultState().settings, j.settings || {}), records: j.records.map(r => ({ date: r.date, equity: Number(r.equity), flow: Number(r.flow) || 0, cost: Number(r.cost) || 0, lots: Number(r.lots) || 0, note: String(r.note || '') })).sort((a, b) => a.date.localeCompare(b.date)), lastBackup: Date.now() };
    demo = null; persist(); setDlg.close(); calMonth = null; render(); syncBench(); toast(`已還原 ${state.records.length} 天紀錄`);
  } catch (e) { $('#sErr').textContent = '這不是有效的備份檔：' + e.message; }
  ev.target.value = '';
});
let wipeArmed = false;
$('#bWipe').onclick = () => {
  if (!wipeArmed) { wipeArmed = true; $('#bWipe').textContent = '⚠️ 確定嗎？再按一次就全部刪掉（建議先匯出備份）'; setTimeout(() => { wipeArmed = false; $('#bWipe').textContent = '🗑️ 清除全部資料'; }, 4000); return; }
  state = defaultState(); persist(); wipeArmed = false; $('#bWipe').textContent = '🗑️ 清除全部資料'; setDlg.close(); render(); toast('已清除');
};

/* ---------- theme / misc ---------- */
function applyTheme(t) {
  if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme');
  const dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.querySelector('meta[name="theme-color"]').content = dark ? '#121211' : '#f6f4ef';
}
let theme = null; try { theme = localStorage.getItem(THEME_KEY); } catch (e) {}
applyTheme(theme);
$('#themeBtn').onclick = () => {
  const dark = document.documentElement.getAttribute('data-theme') ? document.documentElement.getAttribute('data-theme') === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  theme = dark ? 'light' : 'dark'; applyTheme(theme); try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
  render();
};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (!theme) { applyTheme(null); render(); } });
document.querySelectorAll('[data-tab-btn]').forEach(b => b.onclick = () => setTab(b.dataset.tabBtn));
$('#tabAdd').onclick = () => openEntry();
mq.addEventListener('change', render);
let tt; function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2600); }
let rz; let lastW = innerWidth;
addEventListener('resize', () => { if (innerWidth === lastW) return; lastW = innerWidth; clearTimeout(rz); rz = setTimeout(render, 150); });

/* ---------- 範例資料 ---------- */
function makeDemo() {
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const gauss = () => { let u = 0, v = 0; while (!u) u = rnd(); while (!v) v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  const days = []; const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - 1);
  while (days.length < 48) { if (d.getDay() % 6) days.unshift(isoOf(d)); d.setDate(d.getDate() - 1); }
  let eq = 22000; const notes = { 3: '第一次用停損單，有照做', 9: '追高被巴，下次等回測', 17: '連賠三天，今天休息只看盤', 24: '入金一萬，口數不加', 31: '順勢抱單，賺最多的一天', 40: '手癢多做了幾趟，手續費好痛' };
  const records = days.map((date, i) => {
    const flow = i === 24 ? 10000 : 0;
    const lots = rnd() < 0.18 ? 0 : 1 + Math.floor(rnd() * (i === 40 ? 12 : 5));
    const cost = lots * 32;
    const drift = i > 12 && i < 20 ? -240 : 170;
    const gross = lots ? Math.round(drift + gauss() * 520 + (i === 31 ? 2400 : 0)) : 0;
    eq = Math.round(eq + flow + gross - cost);
    return { date, equity: eq, flow, cost, lots, note: notes[i] || '' };
  });
  return { settings: { name: '範例', capital: 22000 }, records, lastBackup: Date.now() };
}

/* ---------- start ---------- */
if (location.hash === '#demo' && !state.records.length) demo = makeDemo();
render();
syncBench();
setInterval(() => { if (document.visibilityState === 'visible') syncBench(); }, 30 * 60 * 1000);
})();

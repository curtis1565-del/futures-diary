<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fffaf0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121b2e" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="智勳期貨日記">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>林智勳的期貨日記</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="preload" href="fonts/huninn-diary.woff" as="font" type="font/woff" crossorigin>
<style>
:root {
  color-scheme: light;
  --bg: #f6f4ef;
  --card: #fffefb;
  --card-2: #f3f1ea;
  --ink: #1d1c1a;
  --ink-2: #52514e;
  --muted: #8a887f;
  --line: #e6e3da;
  --grid: #ece9e1;
  --up: #c62828;        /* 台灣習慣：紅＝賺 */
  --up-mark: #e34948;
  --up-soft: #fbe3e1;
  --down: #0f7b3a;      /* 綠＝賠 */
  --down-mark: #1a9a52;
  --down-soft: #dcf1e3;
  --mine: #2a78d6;
  --bench: #eb6834;
  --accent: #2a78d6;
  --accent-ink: #ffffff;
  --gold: #b7791f;
  --water: #4a9be8;
  --shadow: 0 1px 2px rgba(30,28,20,.06), 0 6px 20px rgba(30,28,20,.05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121211; --card: #1a1a19; --card-2: #222220; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #8f8e86;
    --line: #2e2d2a; --grid: #262523; --up: #ff7b72; --up-mark: #e66767; --up-soft: #3a1f1e; --down: #56d18f;
    --down-mark: #2fae6a; --down-soft: #16301f; --mine: #3987e5; --bench: #d95926; --accent: #3987e5; --gold: #e0a84a; --water: #3987e5;
    --shadow: 0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --card: #1a1a19; --card-2: #222220; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #8f8e86;
  --line: #2e2d2a; --grid: #262523; --up: #ff7b72; --up-mark: #e66767; --up-soft: #3a1f1e; --down: #56d18f;
  --down-mark: #2fae6a; --down-soft: #16301f; --mine: #3987e5; --bench: #d95926; --accent: #3987e5; --gold: #e0a84a; --water: #3987e5;
  --shadow: 0 1px 2px rgba(0,0,0,.3);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; scroll-padding-top: 64px; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  font-size: 15px; line-height: 1.55;
}
.num, .tile b, td, .cal-cell { font-variant-numeric: tabular-nums; }
button, input, textarea { font: inherit; color: inherit; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px 80px; }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--ink-2); }
.muted { color: var(--muted); }
h1, h2, h3 { margin: 0; line-height: 1.3; }
h2 { font-size: 18px; }
.eyebrow { font-size: 11px; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; margin: 0 0 2px; }

/* top bar */
.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1080px; margin: 0 auto; padding: 8px 16px; display: flex; align-items: center; gap: 10px; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; white-space: nowrap; }
.brand-logo { width: 28px; height: 28px; border-radius: 8px; object-fit: cover; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 15px; }
.nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; flex: 1; }
.nav::-webkit-scrollbar { display: none; }
.nav a { text-decoration: none; color: var(--ink-2); font-size: 13px; padding: 5px 10px; border-radius: 999px; white-space: nowrap; }
.nav a:hover { background: var(--card-2); color: var(--ink); }
.icon-btn { border: 1px solid var(--line); background: var(--card); border-radius: 10px; width: 34px; height: 34px; display: grid; place-items: center; cursor: pointer; flex: none; }
.icon-btn:hover { border-color: var(--muted); }

/* banners */
.banner { margin: 12px 0 0; padding: 10px 14px; border-radius: 12px; font-size: 14px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; border: 1px solid var(--line); background: var(--card); }
.banner.warn { border-color: color-mix(in srgb, var(--gold) 45%, var(--line)); background: color-mix(in srgb, var(--gold) 10%, var(--card)); }
.banner .sp { flex: 1; }

/* buttons */
.btn { border: 1px solid var(--line); background: var(--card); padding: 8px 14px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 14px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.big { padding: 12px 20px; font-size: 16px; border-radius: 12px; }
.btn.danger { color: var(--up); }
.btn.small { padding: 4px 10px; font-size: 13px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* cards */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; box-shadow: var(--shadow); margin-top: 16px; }
.card-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.card-head p.sub { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
.foot { font-size: 12.5px; color: var(--muted); margin: 10px 0 0; }
.grid2 { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 16px; }
.grid2 > .card { margin-top: 0; }
.grid2 { margin-top: 16px; }
@media (max-width: 820px) { .grid2 { grid-template-columns: minmax(0,1fr); } }

/* hero */
.hero { display: grid; grid-template-columns: minmax(0,1.1fr) minmax(0,1.4fr); gap: 18px; align-items: center; }
@media (max-width: 760px) { .hero { grid-template-columns: minmax(0,1fr); } }
.hero-eq { font-size: clamp(34px, 8vw, 48px); font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
.hero-eq small { font-size: 16px; font-weight: 600; color: var(--muted); margin-left: 4px; }
.hero-today { margin-top: 6px; font-size: 16px; font-weight: 700; }
.hero-today .muted { font-weight: 400; font-size: 13px; }
.hero-cta { margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
.tile { background: var(--card-2); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.tile span { display: block; font-size: 12.5px; color: var(--ink-2); }
.tile b { display: block; font-size: 20px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile em { font-style: normal; font-size: 12px; color: var(--muted); }
.reminder { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 4px 10px; border-radius: 999px; background: color-mix(in srgb, var(--gold) 15%, transparent); color: var(--gold); font-weight: 600; }
.reminder.done { background: color-mix(in srgb, var(--down) 12%, transparent); color: var(--down); }

/* summary table */
.sum-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; }
@media (max-width: 820px) { .sum-grid { grid-template-columns: minmax(0,1fr); } }
.sum-group h3 { font-size: 13px; color: var(--muted); font-weight: 600; margin: 0 0 6px; }
.sum-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
.sum-row:last-child { border-bottom: 0; }
.sum-row .k { color: var(--ink-2); display: flex; align-items: center; gap: 4px; }
.sum-row .k small { color: var(--muted); font-size: 11px; }
.sum-row .v { font-weight: 700; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.q { border: 0; background: var(--card-2); color: var(--muted); width: 17px; height: 17px; border-radius: 50%; font-size: 11px; line-height: 17px; padding: 0; cursor: help; flex: none; }
.explain { font-size: 12.5px; color: var(--ink-2); background: var(--card-2); border-radius: 8px; padding: 6px 10px; margin: 0 0 6px; }
.tips { margin: 14px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.tips li { font-size: 14px; padding: 8px 12px; border-radius: 10px; background: var(--card-2); display: flex; gap: 8px; }

/* charts */
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); }
.legend i { display: inline-block; width: 18px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 6px; }
.legend i.dash { border-top-style: dashed; }
.legend i.box { width: 10px; height: 10px; border: 0; border-radius: 3px; }
.chart { position: relative; width: 100%; margin-top: 8px; touch-action: pan-y; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart svg:focus { outline: none; }
.chart svg:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 6px; }
.chart .axis { fill: var(--muted); font-size: 11px; }
.chart .gridl { stroke: var(--grid); stroke-width: 1; }
.chart .zerol { stroke: var(--muted); stroke-width: 1; opacity: .6; }
.chart .refl { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
.chart .reft { fill: var(--muted); font-size: 11px; }
.tip { position: absolute; pointer-events: none; z-index: 5; background: var(--card); border: 1px solid var(--line); box-shadow: 0 6px 24px rgba(0,0,0,.12); border-radius: 10px; padding: 8px 10px; font-size: 12.5px; min-width: 140px; opacity: 0; transition: opacity .12s; }
.tip.show { opacity: 1; }
.tip .t-date { font-weight: 700; margin-bottom: 4px; }
.tip .t-row { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.tip .t-row span:first-child { color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.tip .sw { width: 10px; height: 3px; border-radius: 2px; display: inline-block; }
.tip b { font-variant-numeric: tabular-nums; }
.seg { display: inline-flex; background: var(--card-2); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 4px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.chart-stats { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); }
.chart-stats b { color: var(--ink); }

/* win rate */
.wr { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 4px; }
@media (max-width: 520px) { .wr { grid-template-columns: 1fr; } }
.wr-box { background: var(--card-2); border-radius: 12px; padding: 12px; }
.wr-box .big { font-size: 26px; font-weight: 800; }
.wr-box .lbl { font-size: 12.5px; color: var(--ink-2); }
.wr-bar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; gap: 2px; margin: 8px 0 6px; background: var(--card); }
.wr-bar div { height: 100%; }
.wr-cap { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-2); }
.pay-row { display: grid; grid-template-columns: 52px 1fr auto; align-items: center; gap: 8px; font-size: 12.5px; margin-top: 6px; }
.pay-track { height: 10px; background: var(--card); border-radius: 5px; overflow: hidden; }
.pay-track div { height: 100%; border-radius: 0 4px 4px 0; }

/* calendar */
.cal-nav { display: flex; align-items: center; gap: 8px; }
.cal-nav strong { min-width: 96px; text-align: center; font-size: 16px; }
.cal-sum { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); margin: 4px 0 10px; }
.cal-sum b { color: var(--ink); }
.cal { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)) minmax(0,.9fr); gap: 4px; }
.cal-h { font-size: 12px; color: var(--muted); text-align: center; padding: 2px 0; }
.cal-cell { min-height: 64px; border-radius: 10px; padding: 5px 6px; background: var(--card-2); display: flex; flex-direction: column; gap: 1px; font-size: 12px; position: relative; min-width: 0; overflow: hidden; }
.cal-cell.out { background: transparent; }
.cal-cell.empty .d { color: var(--muted); }
.cal-cell .d { font-size: 11px; color: var(--ink-2); }
.cal-cell .p { font-weight: 700; font-size: 13px; white-space: nowrap; }
.cal-cell .r { font-size: 11px; opacity: .85; white-space: nowrap; }
.cal-cell .c { font-size: 10.5px; color: var(--gold); white-space: nowrap; }
.cal-cell.today { box-shadow: inset 0 0 0 2px var(--accent); }
.cal-cell.week { background: transparent; border: 1px dashed var(--line); }
.cal-cell button.cell-btn { all: unset; position: absolute; inset: 0; cursor: pointer; border-radius: 10px; }
.cal-cell button.cell-btn:focus-visible { outline: 2px solid var(--accent); }
.cal-legend { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-top: 10px; flex-wrap: wrap; }
.cal-legend span.sq { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }

/* leak bucket */
.leak { display: grid; grid-template-columns: 170px 1fr; gap: 18px; align-items: center; }
@media (max-width: 600px) { .leak { grid-template-columns: 1fr; justify-items: center; } }
.bucket svg { width: 160px; height: auto; display: block; }
.drop { animation: drip 2.2s infinite ease-in; opacity: 0; }
.drop.d2 { animation-delay: .7s; } .drop.d3 { animation-delay: 1.4s; }
@keyframes drip { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(46px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .drop { animation: none; opacity: 1; } html { scroll-behavior: auto; } }
.leak-eq { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: var(--card-2); border-radius: 12px; padding: 10px 12px; font-size: 14px; margin-top: 10px; }
.leak-eq .op { color: var(--muted); font-weight: 700; }
.leak-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
@media (max-width: 520px) { .leak-tiles { grid-template-columns: 1fr 1fr; } }
.leak-tiles .tile b { font-size: 18px; }

/* table */
.tbl-wrap { overflow-x: auto; margin: 0 -4px; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: right; font-weight: 600; color: var(--muted); font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { text-align: right; padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
td.note { text-align: left; white-space: normal; min-width: 160px; max-width: 260px; color: var(--ink-2); font-size: 12.5px; }

/* empty / onboarding */
.onboard { text-align: center; padding: 34px 18px; }
.onboard .emoji { font-size: 44px; }
.onboard h2 { font-size: 22px; margin: 8px 0 6px; }
.onboard p { color: var(--ink-2); max-width: 520px; margin: 0 auto 16px; }
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 640px; margin: 18px auto 0; text-align: left; }
@media (max-width: 600px) { .steps { grid-template-columns: 1fr; } }
.steps div { background: var(--card-2); border-radius: 12px; padding: 10px 12px; font-size: 13.5px; }
.steps b { display: block; margin-bottom: 2px; }

/* dialog */
dialog { border: 0; border-radius: 18px; padding: 0; width: min(460px, calc(100vw - 24px)); background: var(--card); color: var(--ink); box-shadow: 0 20px 60px rgba(0,0,0,.25); }
dialog::backdrop { background: rgba(10,10,8,.45); }
.dlg { padding: 20px; max-height: calc(100dvh - 40px); overflow-y: auto; }
.dlg h2 { font-size: 20px; }
.dlg .sub { color: var(--muted); font-size: 13px; margin: 2px 0 14px; }
.field { display: grid; gap: 4px; margin-bottom: 12px; }
.field > span { font-size: 13.5px; font-weight: 600; }
.field > span small { font-weight: 400; color: var(--muted); }
.field input, .field textarea { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 16px; }
.field input:focus, .field textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
.field input.huge { font-size: 26px; font-weight: 800; padding: 10px 12px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.flow-seg { display: flex; gap: 6px; margin-bottom: 6px; }
.flow-seg button { flex: 1; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 7px; cursor: pointer; font-size: 13.5px; }
.flow-seg button[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--bg)); font-weight: 700; }
.preview { background: var(--card-2); border-radius: 12px; padding: 10px 12px; font-size: 14px; margin-bottom: 14px; }
.preview b { font-size: 18px; }
.dlg-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.dlg-actions .sp { flex: 1; }
details.more summary { cursor: pointer; font-size: 13.5px; color: var(--ink-2); margin-bottom: 10px; }
.err { color: var(--up); font-size: 13px; min-height: 1em; margin: 0 0 8px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 600; opacity: 0; transition: .25s; z-index: 50; pointer-events: none; max-width: calc(100vw - 32px); }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.set-list { display: grid; gap: 8px; }
.set-list .btn { text-align: left; }
.hidden { display: none !important; }
.sync-badge { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; white-space: nowrap; background: color-mix(in srgb, var(--down-mark) 16%, var(--card)); color: var(--down); border: 1px solid color-mix(in srgb, var(--down-mark) 30%, transparent); }
.sync-badge.syncing { background: color-mix(in srgb, var(--accent) 14%, var(--card)); color: var(--accent); border-color: transparent; }
.sync-badge.fail { background: color-mix(in srgb, var(--gold) 18%, var(--card)); color: var(--gold); border-color: transparent; }
.sync-badge.view { background: var(--grad); color: #fff; border: 0; }
.sync-line { margin-top: -8px !important; }
.code-box { background: var(--grad-soft); border-radius: 12px; padding: 10px 12px 2px; margin-bottom: 12px; }
.code-box .field { margin-bottom: 4px; }
.code-row { display: flex; gap: 8px; }
.code-row input { flex: 1; min-width: 0; font-size: 15px !important; }
.code-on { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13.5px; font-weight: 600; padding: 4px 0 2px; }
.code-on span { flex: 1 1 100%; }
.install { position: relative; margin-top: 12px; padding: 14px 16px; border-radius: 16px; background: var(--grad); color: #fff; box-shadow: 0 12px 28px -14px var(--glow); }
.install b { font-size: 16px; }
.install ol { margin: 8px 0 4px; padding-left: 20px; font-size: 14px; line-height: 1.7; }
.install .share { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; background: rgba(255,255,255,.25); font-size: 13px; vertical-align: -4px; }
.install small { display: block; font-size: 12.5px; opacity: .92; }
.install .x { position: absolute; top: 8px; right: 8px; border: 0; background: rgba(255,255,255,.22); color: #fff; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-size: 14px; }
.install .btn { background: #fff; color: #7c3aed; border: 0; margin-top: 6px; }
body.view-mode #setBtn { display: none; }
body.view-mode #tabAdd { visibility: hidden; }

/* ---------- 手機版：底部分頁、單張圖表、卡片式紀錄、底部滑出輸入 ---------- */
.dlg-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.date-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.date-chips { display: flex; gap: 6px; }
.date-chips button, .chips button { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 7px 14px; font-size: 14px; cursor: pointer; white-space: nowrap; color: var(--ink-2); }
.date-chips button[aria-pressed="true"], .chips button[aria-selected="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--card)); color: var(--ink); font-weight: 700; }
.date-row input[type=date] { flex: 1; min-width: 140px; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 7px 10px; font-size: 16px; }
.dlg-actions.sticky { position: sticky; bottom: 0; background: var(--card); padding: 12px 0 14px; margin-top: 4px; }
.sum-group > summary { list-style: none; }
.sum-group > summary::-webkit-details-marker { display: none; }
.sum-group > summary .peek { display: none; }
body:not(.m) .sum-group > summary { pointer-events: none; }
.tabbar, .chips, .log-cards { display: none; }
.lc-month { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-2); padding: 10px 2px 0; }
.log-card { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 50px 1fr 12px; column-gap: 10px; row-gap: 2px; align-items: center; background: var(--card-2); border-radius: 12px; padding: 10px 12px; cursor: pointer; width: 100%; -webkit-tap-highlight-color: transparent; }
.log-card:active { transform: scale(.99); }
.log-card:focus-visible { outline: 2px solid var(--accent); }
.lc-date { grid-row: 1 / span 2; font-weight: 700; font-size: 16px; display: flex; flex-direction: column; line-height: 1.2; }
.lc-date small { font-weight: 400; color: var(--muted); font-size: 12px; }
.lc-main { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-variant-numeric: tabular-nums; }
.lc-main b { font-size: 17px; }
.lc-main small { font-size: 13px; font-weight: 600; }
.lc-eq { font-size: 12.5px; color: var(--ink-2); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; grid-column: 2; font-variant-numeric: tabular-nums; }
.lc-tag { background: var(--card); border-radius: 999px; padding: 0 8px; font-size: 11.5px; }
.lc-note { grid-column: 2 / 4; font-size: 13px; color: var(--ink-2); margin-top: 2px; }
.lc-go { grid-column: 3; grid-row: 1 / span 2; color: var(--muted); font-size: 20px; }
@keyframes sheetUp { from { transform: translateY(60px); opacity: .4; } to { transform: none; opacity: 1; } }
@media (max-width: 760px) {
  body { font-size: 15.5px; }
  .nav { display: none; }
  .brand { flex: 1; min-width: 0; }
  .brand span:last-child { overflow: hidden; text-overflow: ellipsis; }
  body.m [data-tab]:not(.tab-on) { display: none !important; }
  body.m [data-chart]:not(.chart-on) { display: none !important; }
  body.m .toast { bottom: calc(92px + env(safe-area-inset-bottom)); }
  body.m .wrap { padding-bottom: calc(100px + env(safe-area-inset-bottom)); }
  .card { padding: 14px; border-radius: 14px; margin-top: 12px; }
  .card-head { margin-bottom: 8px; }
  h2 { font-size: 17px; }
  .hero-eq { font-size: 42px; }
  .tile b { font-size: 19px; }
  body.m .tabbar { display: grid; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; grid-template-columns: repeat(5, 1fr); background: color-mix(in srgb, var(--card) 94%, transparent); backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); }
  .tabbar button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11.5px; color: var(--muted); padding: 2px 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .tabbar .ic { font-size: 21px; line-height: 1.15; filter: grayscale(1); opacity: .7; }
  .tabbar button[aria-current="page"] { color: var(--accent); font-weight: 700; }
  .tabbar button[aria-current="page"] .ic { filter: none; opacity: 1; }
  .tabbar .add .ic { width: 54px; height: 54px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 30px; font-weight: 300; margin-top: -24px; box-shadow: 0 6px 18px rgba(0,0,0,.25); filter: none; opacity: 1; border: 4px solid var(--bg); }
  .tabbar .add { color: var(--accent); font-weight: 700; }
  body.m .chips { display: flex; position: sticky; top: 51px; z-index: 10; gap: 6px; overflow-x: auto; scrollbar-width: none; background: var(--bg); margin: 0 -16px; padding: 10px 16px 4px; }
  .chips::-webkit-scrollbar { display: none; }
  body.m .grid2 { margin-top: 0; display: block; }
  body.m .grid2 > .card { margin-top: 12px; }
  body.m .sum-grid { gap: 8px; }
  body.m .sum-group { background: var(--card-2); border-radius: 12px; padding: 0 12px; }
  body.m .sum-group > summary { cursor: pointer; padding: 12px 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; -webkit-tap-highlight-color: transparent; }
  body.m .sum-group > summary h3 { margin: 0; font-size: 14.5px; color: var(--ink); flex: 1; }
  body.m .sum-group > summary .peek { display: block; font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; }
  body.m .sum-group > summary::after { content: '›'; color: var(--muted); font-size: 18px; transition: transform .2s; }
  body.m .sum-group[open] > summary::after { transform: rotate(90deg); }
  body.m .sum-group[open] > summary .peek { display: none; }
  body.m .sum-group[open] { padding-bottom: 6px; }
  body.m .sum-row .k small { display: none; }
  .sum-row { padding: 9px 0; }
  .cal { gap: 3px; }
  .cal-cell { min-height: 58px; padding: 4px; border-radius: 8px; }
  .cal-cell .p { font-size: 12.5px; }
  .cal-cell .c { display: none; }
  .cal-coin-note { display: none; }
  .cal-nav strong { min-width: 0; font-size: 15px; }
  body.m .log-table { display: none; }
  body.m .log-cards { display: grid; gap: 8px; }
  dialog { width: 100%; max-width: 100%; margin: auto 0 0; border-radius: 22px 22px 0 0; max-height: 94dvh; animation: sheetUp .22s ease-out; }
  .dlg { max-height: 94dvh; padding: 10px 16px 0; }
  .dlg::before { content: ''; display: block; width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 10px; }
  .dlg-actions.sticky { padding-bottom: calc(14px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); margin: 4px -16px 0; padding-left: 16px; padding-right: 16px; }
  .dlg-actions.sticky #fSave { flex: 1; padding: 14px; font-size: 17px; border-radius: 12px; }
  .field input.huge { font-size: 30px; }
  .flow-seg button { padding: 10px 6px; }
}
@media (prefers-reduced-motion: reduce) { dialog { animation: none; } }
/* ================= 吉他貓 × 舊金山（2026-10-20，取代活潑版）：配色照 8906，全部實色、不發光 ================= */
@font-face { font-family: 'Huninn'; src: url(fonts/huninn-diary.woff) format('woff'); font-display: swap; }
:root {
  --bg: #fff6e3; --card: #fffdf9; --card-2: #fff5da; --field: #fffaf0; --ink: #261b36; --ink-2: #4d4260; --muted: #6c6280;
  --line: #ecdcbf; --grid: #f2e8d5;
  --up: #c8203f; --up-mark: #ef4444; --up-soft: #fde4e6;
  --down: #047857; --down-mark: #059669; --down-soft: #d6f3e6;
  --mine: #7c3aed; --bench: #ea580c; --accent: #db2777; --accent-ink: #ffffff; --accent-deep: #9d174d; --accent-text: #be185d;
  --gold: #b45309; --gold-fill: #fbbf24; --gold-ink: #422006; --water: #0ea5e9;
  --hero: #6d28d9; --hero-deep: #4c1d95; --hero-tile: #fff8e6; --topbar: #fffaf0; --frame: #e6a798; --toast: #2b1d3a; --toast-ink: #fff6e3;
  --c-pink: #db2777; --c-blue: #2563eb; --c-purple: #7c3aed; --c-teal: #0e7490; --c-wood: #8a5a2b; --c-orange: #c2410c; --c-sky: #0369a1; --c-fuchsia: #a21caf; --c-gold: #b45309;
  --wash: linear-gradient(125deg, #ffe1ea 0%, #fff1d2 20%, #e4f8e2 42%, #dcf2ff 64%, #eae3ff 84%, #ffe2f2 100%);
  --rainbow: linear-gradient(90deg, #f0476b, #f58a1f, #f2c230, #2fbf71, #1fb5d6, #3b82f6, #8b5cf6, #ec4899);
  --grad: var(--hero); --grad-soft: var(--card-2); --glow: transparent; --shadow: none;
  --top-h: 63px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1424; --card: #151f33; --card-2: #1c2943; --field: #0f182a; --ink: #f4f1ea; --ink-2: #cdd5e4; --muted: #a3aec3;
    --line: #2b3a57; --grid: #22304d;
    --up: #ff8a8a; --up-soft: #3a1b26; --down: #34d399; --down-soft: #0f2e27;
    --mine: #8b5cf6; --bench: #ea580c; --accent: #ff6eb4; --accent-ink: #2a0a1c; --accent-deep: #9d174d; --accent-text: #ff6eb4;
    --gold: #fbbf24; --water: #38bdf8;
    --hero: #5b21b6; --hero-deep: #2e1065; --hero-tile: #1c2943; --topbar: #121b2e; --frame: #7a2d21;
    --wash: linear-gradient(160deg, #0d1424 0%, #121a30 55%, #1a1430 100%);
  }
}
:root[data-theme="dark"] {
  --bg: #0d1424; --card: #151f33; --card-2: #1c2943; --field: #0f182a; --ink: #f4f1ea; --ink-2: #cdd5e4; --muted: #a3aec3;
  --line: #2b3a57; --grid: #22304d;
  --up: #ff8a8a; --up-soft: #3a1b26; --down: #34d399; --down-soft: #0f2e27;
  --mine: #8b5cf6; --bench: #ea580c; --accent: #ff6eb4; --accent-ink: #2a0a1c; --accent-deep: #9d174d; --accent-text: #ff6eb4;
  --gold: #fbbf24; --water: #38bdf8;
  --hero: #5b21b6; --hero-deep: #2e1065; --hero-tile: #1c2943; --topbar: #121b2e; --frame: #7a2d21;
  --wash: linear-gradient(160deg, #0d1424 0%, #121a30 55%, #1a1430 100%);
}
html { scroll-padding-top: calc(var(--top-h) + 8px); }
body { font-family: 'Huninn', -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; background: var(--wash), var(--bg); background-attachment: fixed; }
/* 自己打的字（心得）用系統字，不會一行裡混到兩種字型 */
.lc-note, td.note, #fNote { font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
h1, h2, h3 { font-weight: 700; }

/* 上方：彩虹條＋吉他貓頭像 */
.top { background: var(--topbar); backdrop-filter: none; border-bottom: 2px solid var(--line); }
.top::before { content: ''; display: block; height: 5px; background: var(--rainbow); }
.top-in { padding: 8px 16px; }
.brand { gap: 10px; }
.brand-cat { width: 40px; height: 40px; flex: none; border: 0; padding: 3px; border-radius: 14px; cursor: pointer; background: conic-gradient(from 210deg, #f0476b, #f58a1f, #f2c230, #2fbf71, #1fb5d6, #3b82f6, #8b5cf6, #ec4899, #f0476b); -webkit-tap-highlight-color: transparent; }
.brand-cat svg { display: block; width: 100%; height: 100%; border-radius: 11px; background: #fff3c4; }
#brandName { font-size: 18px; color: var(--ink); letter-spacing: .02em; }
.nav a { font-weight: 600; }
.nav a:hover { background: color-mix(in srgb, var(--accent) 12%, var(--card)); }
.icon-btn { width: 38px; height: 38px; border: 2px solid var(--line); border-radius: 50%; background: var(--card); box-shadow: 0 3px 0 var(--line); transition: transform .12s, box-shadow .12s; }
.icon-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.icon-btn:disabled { opacity: .45; box-shadow: none; }

/* 舊金山明信片＋吉他貓說話 */
.pc-wrap { max-width: 1080px; margin: 0 auto; padding: 14px 16px 0; }
.pc-frame { position: relative; overflow: hidden; height: clamp(220px, 26vw, 300px); border: 3px solid var(--frame); border-radius: 22px; background: #cfe6f5; box-shadow: 0 6px 0 color-mix(in srgb, var(--frame) 55%, transparent); }
.pc-frame > svg.scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.pc-frame #sc-shop, .pc-frame #sc-bridge, .pc-frame .sc-boat, .pc-frame #cat-slot { cursor: pointer; -webkit-tap-highlight-color: transparent; }
.cat-say { position: relative; margin: 14px 2px 0; padding: 9px 14px; background: var(--card); color: var(--ink); border: 2px solid var(--ink); border-radius: 18px; box-shadow: 0 3px 0 var(--ink); font-size: 15px; line-height: 1.5; min-height: 46px; }
.cat-say::before { content: ''; position: absolute; top: -11px; left: var(--say-x, 62%); width: 18px; height: 18px; background: var(--card); border-left: 2px solid var(--ink); border-top: 2px solid var(--ink); transform: translateX(-50%) rotate(45deg); border-radius: 4px 0 0 0; }
.cat-say b { color: var(--accent-text); margin-right: 6px; }
.fx-note { position: absolute; z-index: 3; pointer-events: none; font-size: 22px; font-weight: 700; animation: noteUp 1.3s ease-out forwards; }
@keyframes noteUp { from { transform: translate(-50%, 0) scale(.8); opacity: 0; } 15% { opacity: 1; } to { transform: translate(calc(-50% + var(--dx, 0px)), -70px) scale(1.15); opacity: 0; } }
svg.scene .sc-bob { animation: scBob 3.6s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
svg.scene .sc-drift { animation: scDrift 16s ease-in-out infinite alternate; }
@keyframes scBob { from { transform: translateY(0) rotate(-1.2deg); } to { transform: translateY(4px) rotate(1.2deg); } }
@keyframes scDrift { to { transform: translateX(34px); } }
.gcat .gc-tail { animation: gcTail 2.8s ease-in-out infinite alternate; }
@keyframes gcTail { from { transform: rotate(-6deg); } to { transform: rotate(8deg); } }
.gcat.strumming .gc-strum { animation: gcStrum .16s ease-in-out 6 alternate; }
@keyframes gcStrum { to { transform: rotate(-14deg); } }

/* 卡片：每區一色，上緣色條＋實色陰影 */
.card { --hue: var(--c-pink); background: var(--card); border: 2px solid color-mix(in srgb, var(--hue) 26%, var(--line)); border-top: 7px solid var(--hue); border-radius: 22px; box-shadow: 0 5px 0 color-mix(in srgb, var(--hue) 22%, transparent); }
#sec-summary { --hue: var(--c-pink); } #sec-curve { --hue: var(--c-blue); } #sec-perf { --hue: var(--c-purple); }
[data-chart="daily"] { --hue: var(--c-orange); } [data-chart="win"] { --hue: var(--c-teal); } [data-chart="dd"] { --hue: var(--c-sky); }
#sec-calendar { --hue: var(--c-wood); } #sec-cost { --hue: var(--c-fuchsia); } #sec-log { --hue: var(--c-gold); } .onboard { --hue: var(--c-pink); }
.eyebrow { display: table; margin: 0 0 8px; padding: 3px 12px; border-radius: 999px; background: var(--hue, var(--c-pink)); color: #fff; font-size: 12.5px; font-weight: 700; letter-spacing: .06em; text-transform: none; box-shadow: 0 3px 0 color-mix(in srgb, var(--hue, var(--c-pink)) 62%, #000); }
.card h2 { display: inline; -webkit-box-decoration-break: clone; box-decoration-break: clone; padding: 0 4px; border-radius: 6px; background: linear-gradient(transparent 56%, color-mix(in srgb, var(--hue) 26%, var(--card)) 56%, color-mix(in srgb, var(--hue) 26%, var(--card)) 94%, transparent 94%); }
.card-head p.sub { margin-top: 6px; }

/* 主視覺：紫色貓耳卡 */
#sec-hero { --hue: var(--hero); position: relative; margin-top: 34px; overflow: visible; background: var(--hero); color: #fff; border: 3px solid var(--hero-deep); box-shadow: 0 6px 0 var(--hero-deep); }
#sec-hero .ear { position: absolute; top: -27px; width: 46px; height: 32px; pointer-events: none; }
#sec-hero .ear.l { left: 26px; } #sec-hero .ear.r { right: 26px; transform: scaleX(-1); }   /* 斜度畫在形狀裡，不旋轉，耳朵根部才會跟卡片邊框接齊 */
#sec-hero .ear .o { fill: var(--hero); stroke: var(--hero-deep); stroke-width: 3; stroke-linejoin: round; }
#sec-hero .ear .i { fill: #f9a8d4; }
#sec-hero .ear .cover { fill: var(--hero); }
#sec-hero .eyebrow { background: #fff; color: var(--hero-deep); box-shadow: 0 3px 0 var(--hero-deep); }
#sec-hero .hero-eq small { color: #ede9fe; }
#sec-hero .hero-today { display: inline-flex; align-items: baseline; gap: 4px; flex-wrap: wrap; background: var(--hero-tile); padding: 5px 14px; border-radius: 999px; font-size: 15px; border: 2px solid var(--hero-deep); }
#sec-hero .hero-today .muted { color: var(--muted); }
#sec-hero .btn.primary { background: var(--gold-fill); color: var(--gold-ink); border: 3px solid #fff; box-shadow: 0 4px 0 #b45309; }
#sec-hero .btn.primary:active { box-shadow: 0 1px 0 #b45309; }
#sec-hero .reminder { background: #fff; color: var(--hero-deep); }
#sec-hero .reminder.done { background: #d1fae5; color: #065f46; }
#sec-hero .tile { background: var(--hero-tile); color: var(--ink); border: 2px solid var(--hero-deep); border-radius: 16px; }
#sec-hero .tile span { color: var(--ink-2); }
#sec-hero .tile em { color: var(--muted); }
.tile span { font-weight: 600; }

/* 按鈕：糖果膠囊（下緣實色立體邊） */
.btn { border: 2px solid var(--line); border-radius: 999px; font-weight: 700; box-shadow: 0 3px 0 var(--line); transition: transform .12s, box-shadow .12s; }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 4px 0 var(--accent-deep); }
.btn.primary:hover { filter: none; border-color: var(--accent-deep); }
.btn.primary:active { box-shadow: 0 1px 0 var(--accent-deep); }
.btn.danger { color: var(--up); border-color: color-mix(in srgb, var(--up) 40%, var(--line)); }

/* 總表、提示、說明 */
.sum-group[data-grp="0"] { --g: var(--c-gold); } .sum-group[data-grp="1"] { --g: var(--c-pink); } .sum-group[data-grp="2"] { --g: var(--c-teal); }
.sum-group { background: color-mix(in srgb, var(--g) 7%, var(--card)); border: 2px solid color-mix(in srgb, var(--g) 26%, var(--line)); border-radius: 16px; padding: 8px 12px; }
body.m .sum-group { background: color-mix(in srgb, var(--g) 8%, var(--card)); padding: 0 12px; }
.sum-group h3 { color: var(--ink) !important; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.sum-group h3::before { content: ''; width: 6px; height: 16px; border-radius: 3px; background: var(--g); flex: none; }
.sum-row { border-bottom-color: color-mix(in srgb, var(--g, var(--c-pink)) 22%, var(--line)); }
.tips li { background: var(--card-2); border: 2px solid var(--line); border-radius: 14px; }
.wr-box { background: var(--card-2); border: 2px solid var(--line); border-radius: 16px; }
.q { position: relative; background: color-mix(in srgb, var(--accent) 14%, var(--card)); color: var(--accent-text); font-weight: 700; }
.q::after { content: ''; position: absolute; inset: -12px; }   /* 點的範圍放大，圓點本身維持小小的 */
.explain { background: var(--card-2); border: 2px dashed var(--line); }
.reminder { font-weight: 700; }

/* 切換：圖表晶片、單位、日期 */
.chips button, .date-chips button { border: 2px solid var(--line); background: var(--card); color: var(--ink-2); font-weight: 600; box-shadow: 0 2px 0 var(--line); }
.chips button[aria-selected="true"], .seg button[aria-pressed="true"], .date-chips button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; box-shadow: 0 3px 0 var(--accent-deep); }
.seg { background: var(--card-2); border: 2px solid var(--line); border-radius: 999px; }
.seg button { border-radius: 999px; }
.seg button[aria-pressed="true"] { box-shadow: none; }
.flow-seg button { border: 2px solid var(--line); background: var(--field); border-radius: 14px; color: var(--ink); }
.flow-seg button[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--field)); }
body.m .chips { top: var(--top-h); background: var(--topbar); backdrop-filter: none; border-bottom: 2px solid var(--line); }
.preview { background: var(--card-2); border: 2px solid var(--line); border-radius: 16px; }

/* 圖表提示框、日曆、紀錄 */
.tip { border: 2px solid var(--line); box-shadow: 0 3px 0 var(--line); border-radius: 12px; }
.cal-cell { border-radius: 12px; }
.cal-cell:not(.week) .p, .cal-cell:not(.week) .r, .cal-cell:not(.week) .c { color: var(--ink); }   /* 底色已經是紅／綠深淺，字一律用墨色才看得清楚 */
.cal-cell .cell-btn:focus-visible { outline-color: var(--ink); }
.cal-cell.today { box-shadow: inset 0 0 0 3px var(--accent); }
.cal-cell.week { border: 2px dashed color-mix(in srgb, var(--c-wood) 45%, var(--line)); }
.cal-cell:has(.cell-btn):active { transform: scale(.97); }
.log-card { border: 2px solid var(--line); border-left: 6px solid var(--muted); border-radius: 14px; background: var(--card); }
.log-card.lc-up { border-left-color: var(--up-mark); }
.log-card.lc-down { border-left-color: var(--down-mark); }
.lc-month b { font-weight: 700; }
.lc-tag { background: var(--card-2); border: 1px solid var(--line); }

/* 第一次使用 */
.onboard { padding: 26px 18px; }
.onboard h2 { display: inline; font-size: 22px; }
.steps div { background: var(--card-2); border: 2px solid var(--line); border-radius: 16px; }
.steps b { color: var(--accent-text); }
.onboard h2 + p { margin-top: 10px; }

/* 對話框（手機＝底部滑出）、輸入框 */
dialog { background: var(--card); border: 2px solid var(--line); box-shadow: none; }
dialog::backdrop { background: rgba(38, 27, 54, .5); }
.dlg::before { background: var(--rainbow) !important; height: 6px !important; }
.dlg h2 { color: var(--ink); }
.field input, .field textarea, .date-row input[type=date] { border: 2px solid var(--line); background: var(--field); border-radius: 14px; }
.field input:focus, .field textarea:focus { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 0; border-color: var(--accent); }
.dlg-actions.sticky { border-top: 2px solid var(--line); }
.toast { background: var(--toast); color: var(--toast-ink); border: 2px solid var(--toast-ink); border-radius: 999px; box-shadow: 0 4px 0 rgba(43, 29, 58, .35); }

/* 輸入提示字、鍵盤焦點、圖表零線、漏水筒警示 */
::placeholder { color: var(--muted); opacity: 1; }
#sec-hero :focus-visible, .install :focus-visible { outline-color: #fff; }
.chart .zerol { opacity: 1; }
.leak-tiles b.cost-warn { color: var(--gold); }
.brand-cat.bounce svg { animation: catBounce .45s ease; }
@keyframes catBounce { 40% { transform: translateY(-4px) rotate(-6deg); } 70% { transform: translateY(1px) rotate(3deg); } }

/* 同步標籤、安裝提示、同步碼 */
.sync-badge { border-width: 2px; }
.sync-badge.syncing { color: var(--accent-text); }
.sync-badge.view { background: var(--hero); color: #fff; }
.code-box { background: var(--card-2); border: 2px dashed var(--line); }
.install { background: var(--hero); color: #fff; border: 3px solid var(--hero-deep); box-shadow: 0 5px 0 var(--hero-deep); border-radius: 20px; }
.install .btn { background: var(--gold-fill); color: var(--gold-ink); border: 2px solid #fff; box-shadow: 0 3px 0 #b45309; }
.install .x { background: #fff; color: var(--hero-deep); }

/* 底部分頁：中間的＋是有貓耳的按鈕 */
body.m .tabbar { background: var(--topbar); backdrop-filter: none; border-top: 2px solid var(--line); }
.tabbar button { font-weight: 600; color: var(--muted); }
.tabbar .ic { filter: grayscale(.55); opacity: .85; }
.tabbar button[aria-current="page"] { color: var(--accent-text); font-weight: 700; }
.tabbar button[aria-current="page"] .ic { filter: none; opacity: 1; transform: translateY(-2px) scale(1.1); }
.tabbar .ic { transition: transform .2s; }
.tabbar .add { color: var(--accent-text); }
.tabbar .add .ic { position: relative; background: var(--accent) !important; color: var(--accent-ink) !important; border: 4px solid var(--topbar) !important; box-shadow: 0 4px 0 var(--accent-deep) !important; filter: none; opacity: 1; animation: none !important; }
.tabbar .add .ic::before, .tabbar .add .ic::after { content: ''; position: absolute; top: -10px; width: 0; height: 0; border-left: 9px solid transparent; border-right: 9px solid transparent; border-bottom: 15px solid var(--accent); }
.tabbar .add .ic::before { left: 3px; transform: rotate(-20deg); } .tabbar .add .ic::after { right: 3px; transform: rotate(20deg); }

/* 賺錢日：音符、貓掌、吉他從天而降 */
.confetti { position: fixed; top: 0; z-index: 60; pointer-events: none; font-size: 22px; font-weight: 700; line-height: 1; }
@keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: none; } }
body.intro #app > * { animation: rise .5s cubic-bezier(.2, .8, .2, 1) both; }
body.intro #app > *:nth-child(2) { animation-delay: .05s; } body.intro #app > *:nth-child(3) { animation-delay: .1s; }
body.intro #app > *:nth-child(4) { animation-delay: .15s; } body.intro #app > *:nth-child(5) { animation-delay: .2s; }
body.intro #app > *:nth-child(n+6) { animation-delay: .25s; }

/* 手機 */
@media (max-width: 760px) {
  .pc-wrap { padding: 12px 16px 0; }
  .pc-frame { height: auto; aspect-ratio: 16 / 9; border-radius: 20px; }
  /* 粉圓的數字比較寬：週合計欄放寬、字距收一點，五位數也放得下 */
  .cal { grid-template-columns: repeat(5, minmax(0,1fr)) minmax(0,1.12fr); }
  .cal-cell .p { letter-spacing: -.03em; }
  .cal-cell.week { padding: 4px 3px; }
  .cal-cell.week .p { font-size: 12px; }
  /* 手機上好點：按鈕至少 40px */
  :root { --top-h: 67px; }
  .icon-btn { width: 44px; height: 44px; }
  .btn.small { min-height: 40px; }
  .seg button { min-height: 40px; }
  .install .x { width: 40px; height: 40px; }
  details.more > summary, .card details:not(.sum-group) > summary { padding: 10px 0; }
  /* 招牌小字在手機上只剩 7px，收起來，大字往下放到招牌正中間 */
  svg.scene .f-sign-sub { display: none; }
  svg.scene text[font-size="38"] { transform: translateY(6px); }
  .cat-say { font-size: 14.5px; }
  #sec-hero { margin-top: 30px; }
  #brandName { font-size: 17px; }
}
@media (max-width: 380px) { .onboard h2 { font-size: 19px; } }
/* 不是總覽分頁時收起明信片 */
body.m:not([data-tab="home"]) .pc-wrap { display: none; }
@media (prefers-reduced-motion: reduce) {
  body.intro #app > * { animation: none; }
  svg.scene .sc-bob, svg.scene .sc-drift, .gcat .gc-tail, .gcat.strumming .gc-strum, .fx-note, .brand-cat.bounce svg { animation: none !important; }
  .fx-note { display: none; }
}
</style>

<script>
(() => {
'use strict';
const KEY = 'futures-nav-diary.v1';
const BENCH_KEY = 'futures-nav-diary.bench.v1';
const THEME_KEY = 'futures-nav-diary.theme';
const CAP_KEY = 'futures-nav-diary.capital40k'; // 本金改 4 萬的一次性記號
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- storage ---------- */
let storageOk = true;
function load(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { storageOk = false; return fallback; }
}
function save(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); return true; } catch (e) { storageOk = false; return false; }
}
const CAPITAL0 = 40000;     // 預設本金（2026/10/20 入金到 4 萬，原本 22,000）
const defaultState = () => ({ settings: { name: '林智勳', capital: CAPITAL0 }, records: [], lastBackup: null });
let state = Object.assign(defaultState(), load(KEY, {}));
state.settings = Object.assign(defaultState().settings, state.settings || {});
state.records = Array.isArray(state.records) ? state.records : [];
let bench = Object.assign({ closes: {}, months: {} }, load(BENCH_KEY, {}));
let demo = null;            // 範例資料只放記憶體，不會存起來
/* ---------- 雲端同步（Google Apps Script） ---------- */
const SYNC_URL = 'https://script.google.com/macros/s/AKfycby6gW8YhJ8w6BF2iG9B2DP1RK9cg001rJL6_IxA-FxKAw7YQd3V_0L8iQefgG94kWvb/exec'; // Apps Script 網頁應用程式（沒有鑰匙會被拒絕）
const SYNC_KEY_STORE = 'futures-nav-diary.sync';
const qs = new URLSearchParams(location.search);
const viewKey = qs.get('view');   // 觀看連結：唯讀
let writeKey = viewKey ? null : qs.get('k');
if (!viewKey) { if (writeKey) save(SYNC_KEY_STORE, writeKey); else writeKey = load(SYNC_KEY_STORE, null); }
let remote = null;          // 觀看模式的資料（只在記憶體）
let syncState = 'off', lastSyncAt = null, syncError = null;
if (viewKey) { state = defaultState(); document.documentElement.classList.add('view-mode'); }
// 本金還停在舊預設 22,000，而且還沒記過、或 10/20 入金後才開始記（第一天沒填入金，例如用舊版記的）→ 改成 4 萬
// 只做一次，之後在 ⚙️ 自己改的不會再被動到；這裡只存手機，雲端等下次記錄時一起更新
if (!viewKey && !load(CAP_KEY, false)) {
  const r0 = state.records.slice().sort((a, b) => a.date.localeCompare(b.date))[0];
  if (Number(state.settings.capital) === 22000 && (!r0 || (r0.date >= '2026-10-20' && !(Number(r0.flow) > 0)))) { state.settings.capital = CAPITAL0; save(KEY, state); }
  save(CAP_KEY, true);
}
let benchStatus = 'idle';   // idle | loading | ok | fail
const persist = () => { if (viewKey) return; state.updatedAt = new Date().toISOString(); save(KEY, state); schedulePush(); };
const view = () => remote || demo || state;
let pushT = null;
function schedulePush() { if (!SYNC_URL || !writeKey) return; clearTimeout(pushT); pushT = setTimeout(pushCloud, 400); }
async function pushCloud() {
  syncState = 'syncing'; renderSync();
  try {
    const res = await fetch(`${SYNC_URL}?key=${encodeURIComponent(writeKey)}`, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ settings: state.settings, records: state.records, updatedAt: state.updatedAt }) });
    const j = await res.json(); if (!j.ok) throw new Error(j.error);
    syncState = 'ok'; lastSyncAt = new Date();
  } catch (e) {
    syncState = 'fail'; clearTimeout(pushT);
    if (e.message === 'readonly' || e.message === 'key') syncError = e.message; else pushT = setTimeout(pushCloud, 60000);
  }
  renderSync();
}
async function pullCloud(key) {
  const res = await fetch(`${SYNC_URL}?key=${encodeURIComponent(key)}&t=${Date.now()}`);
  const j = await res.json(); if (!j.ok) throw new Error(j.error); return j;
}
async function refreshRemote() {
  syncState = 'syncing'; renderSync();
  try {
    const j = await pullCloud(viewKey);
    const next = { settings: Object.assign(defaultState().settings, j.settings || {}), records: j.records || [], updatedAt: j.updatedAt, lastBackup: Date.now() };
    const changed = !remote || JSON.stringify([next.settings, next.records]) !== JSON.stringify([remote.settings, remote.records]);
    remote = next; syncState = 'ok'; lastSyncAt = new Date();
    if (changed) { render(); syncBench(); } else render();
  } catch (e) { syncState = 'fail'; render(); }
}
async function initSync() {
  if (!SYNC_URL) { if (viewKey) { syncState = 'fail'; render(); } return; }
  if (viewKey) {
    await refreshRemote();
    setInterval(() => { if (document.visibilityState === 'visible') refreshRemote(); }, 3 * 60 * 1000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refreshRemote(); });
    return;
  }
  if (!writeKey) return;
  syncState = 'syncing'; renderSync();
  try {
    const j = await pullCloud(writeKey);
    const cloud = j.records || [];
    const cloudNewer = cloud.length && (!state.records.length || (j.updatedAt && state.updatedAt ? j.updatedAt > state.updatedAt : cloud.length > state.records.length));
    if (cloudNewer) {
      const restored = !state.records.length;
      state.settings = Object.assign(defaultState().settings, j.settings || {}); state.records = cloud; state.updatedAt = j.updatedAt;
      save(KEY, state); syncState = 'ok'; lastSyncAt = new Date(); calMonth = null; render(); syncBench();
      if (restored) toast(`☁️ 已從雲端還原 ${cloud.length} 天紀錄`);
    } else if (state.records.length && JSON.stringify(cloud) !== JSON.stringify(state.records)) {
      if (!state.updatedAt) state.updatedAt = new Date().toISOString();
      await pushCloud();
    } else { syncState = 'ok'; lastSyncAt = new Date(); }
  } catch (e) { syncState = 'fail'; }
  renderSync();
}
const hm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
function fmtUpdated(iso) { if (!iso) return '—'; const d = new Date(iso); return isNaN(d) ? '—' : `${d.getMonth() + 1}/${d.getDate()} ${hm(d)}`; }
function renderCodeBox() {
  const box = $('#codeBox'); if (!box) return;
  box.classList.toggle('hidden', !SYNC_URL || !!viewKey);
  $('#codeOff').classList.toggle('hidden', !!writeKey);
  $('#codeOn').classList.toggle('hidden', !writeKey);
}
async function connectCode() {
  const code = $('#sCode').value.replace(/\s+/g, ''), err = $('#codeErr'), btn = $('#bCode');
  err.textContent = '';
  if (!code) { err.textContent = '請貼上同步碼'; return; }
  if (code[0] === 'v') { err.textContent = '這是「觀看碼」，只能看不能記。請貼上寫入用的同步碼。'; return; }
  btn.disabled = true; btn.textContent = '連線中…';
  try {
    await pullCloud(code);
    writeKey = code; syncError = null; save(SYNC_KEY_STORE, code); $('#sCode').value = '';
    await initSync(); renderCodeBox(); toast('☁️ 雲端同步已開啟');
  } catch (e) { err.textContent = e.message === 'key' ? '同步碼不對，請確認有完整貼上' : '連不上雲端，請確認網路後再試'; }
  finally { btn.disabled = false; btn.textContent = '連線'; }
}
async function copyCode() {
  if (!writeKey) return;
  try { await navigator.clipboard.writeText(writeKey); }
  catch (e) { const t = document.createElement('textarea'); t.value = writeKey; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
  toast('📋 同步碼已複製');
}
function renderSync() {
  renderCodeBox();
  const b = $('#syncBadge'), line = $('#sSync');
  if (!b) return;
  if (viewKey) { b.className = 'sync-badge view'; b.textContent = syncState === 'syncing' ? '👀 讀取中…' : '👀 觀看模式'; return; }
  const on = !!(SYNC_URL && writeKey);
  b.classList.toggle('hidden', !on); line.classList.toggle('hidden', !on);
  if (!on) return;
  b.className = 'sync-badge' + (syncState === 'syncing' ? ' syncing' : syncState === 'fail' ? ' fail' : '');
  b.textContent = syncState === 'syncing' ? '☁️ 同步中…' : syncState === 'fail' ? '⚠️ 未同步' : '☁️ 已同步';
  b.title = syncState === 'fail' ? '暫時連不上雲端，資料已存在手機，等一下會自動再試' : lastSyncAt ? `最後同步 ${hm(lastSyncAt)}` : '';
  line.textContent = syncError ? '⚠️ 這個同步碼不能寫入（可能貼到觀看碼），請中斷後重新貼上同步碼。' : syncState === 'fail' ? '⚠️ 雲端同步：暫時連不上，資料已存在手機，會自動重試。' : `☁️ 雲端同步：已開啟${lastSyncAt ? `（最後同步 ${hm(lastSyncAt)}）` : ''}，每次儲存都會自動備份到雲端。`;
}

/* ---------- formatting ---------- */
const nf0 = new Intl.NumberFormat('zh-TW', { maximumFractionDigits: 0 });
const money = v => v == null || !isFinite(v) ? '—' : nf0.format(Math.round(v) || 0);
const sMoney = v => v == null || !isFinite(v) ? '—' : (v > 0 ? '+' : v < 0 ? '−' : '') + nf0.format(Math.abs(Math.round(v)));
const pct = (v, d = 2) => v == null || !isFinite(v) ? '—' : (v * 100).toFixed(d) + '%';
const sPct = (v, d = 2) => { if (v == null || !isFinite(v)) return '—'; const t = Math.abs(v * 100).toFixed(d); return (+t === 0 ? '' : v > 0 ? '+' : '−') + t + '%'; };
const arrow = v => v > 0 ? '▲' : v < 0 ? '▼' : '';
const tone = v => v == null || !isFinite(v) ? 'flat' : v > 0 ? 'up' : v < 0 ? 'down' : 'flat';
const compact = v => {
  const a = Math.abs(v), s = v > 0 ? '+' : v < 0 ? '−' : '';

/* ---------- core math ---------- */
function compute(st) {
  const capital = Number(st.settings.capital) || 0;
  const recs = st.records.slice().sort((a, b) => a.date.localeCompare(b.date));
  const closes = bench.closes;
  const benchDates = Object.keys(closes).sort();
  const closeOn = iso => { // 該日（含）以前最近一個收盤
    let lo = 0, hi = benchDates.length - 1, ans = null;
    while (lo <= hi) { const m = (lo + hi) >> 1; if (benchDates[m] <= iso) { ans = benchDates[m]; lo = m + 1; } else hi = m - 1; }
    return ans ? { date: ans, close: closes[ans] } : null;
  };
  const closeBefore = iso => {
    let ans = null; for (let i = benchDates.length - 1; i >= 0; i--) if (benchDates[i] < iso) { ans = benchDates[i]; break; }
    return ans ? { date: ans, close: closes[ans] } : null;
  };
  const benchBase = recs.length ? closeBefore(recs[0].date) : null;
  let prevEq = capital, idx = 1, peakIdx = 1, cumPnl = 0, peakPnl = 0, cumFlow = 0;
  let bIdxPeak = 1, prevBench = benchBase;
  const rows = recs.map(r => {
    const flow = Number(r.flow) || 0;
    const base = prevEq + flow;
    const pnl = r.equity - prevEq - flow;
    const ret = base > 0 ? pnl / base : 0;
    idx *= 1 + ret; peakIdx = Math.max(peakIdx, idx);
    cumPnl += pnl; peakPnl = Math.max(peakPnl, cumPnl); cumFlow += flow;
    const cost = Number(r.cost) || 0;
    let bClose = null, bCum = null, bRet = null, bDd = null;
    const bc = closeOn(r.date);
    if (benchBase && bc && bc.date >= benchBase.date) {
      bClose = bc.close; bCum = bc.close / benchBase.close - 1;
      const bi = 1 + bCum; bIdxPeak = Math.max(bIdxPeak, bi); bDd = bi / bIdxPeak - 1;
      bRet = prevBench ? bc.close / prevBench.close - 1 : null; prevBench = bc;
    }
    const row = {
      date: r.date, equity: r.equity, flow, pnl, ret, cost, gross: pnl + cost, lots: Number(r.lots) || 0, note: r.note || '',
      cum: idx - 1, dd: idx / peakIdx - 1, cumPnl, ddMoney: cumPnl - peakPnl, cumFlow,
      bClose, bCum, bRet, bDd, benchDate: bc ? bc.date : null
    };
    prevEq = r.equity;
    return row;
  });
  // summary
  const wins = rows.filter(r => r.pnl > 0), losses = rows.filter(r => r.pnl < 0), flats = rows.filter(r => r.pnl === 0);
  const totalProfit = wins.reduce((s, r) => s + r.pnl, 0), totalLoss = losses.reduce((s, r) => s + r.pnl, 0);
  const decided = wins.length + losses.length;
  const avgWin = wins.length ? totalProfit / wins.length : null, avgLoss = losses.length ? totalLoss / losses.length : null;
  const last = rows[rows.length - 1] || null;
  let maxDd = 0, maxDdMoney = 0, maxDdDate = null;
  rows.forEach(r => { if (r.dd < maxDd) { maxDd = r.dd; maxDdDate = r.date; } if (r.ddMoney < maxDdMoney) maxDdMoney = r.ddMoney; });
  let best = null, worst = null;
  rows.forEach(r => { if (!best || r.pnl > best.pnl) best = r; if (!worst || r.pnl < worst.pnl) worst = r; });
  // streaks
  let curKind = 0, cur = 0, maxW = 0, maxL = 0, run = 0, runKind = 0;
  rows.forEach(r => {
    const k = Math.sign(r.pnl);
    if (k === 0) { run = 0; runKind = 0; return; }
    if (k === runKind) run++; else { run = 1; runKind = k; }
    if (k > 0) maxW = Math.max(maxW, run); else maxL = Math.max(maxL, run);
  });
  curKind = runKind; cur = run;
  // highs
  let newHighs = 0, hi = capital; rows.forEach(r => { if (r.dd === 0 && r.pnl > 0) newHighs++; });
  const totalCost = rows.reduce((s, r) => s + r.cost, 0), totalLots = rows.reduce((s, r) => s + r.lots, 0);
  const deposits = rows.reduce((s, r) => s + Math.max(0, r.flow), 0), withdrawals = rows.reduce((s, r) => s + Math.min(0, r.flow), 0);
  const netPnl = last ? last.cumPnl : 0;
  const grossPnl = netPnl + totalCost;
  const vol = (() => { if (rows.length < 2) return null; const m = rows.reduce((s, r) => s + r.ret, 0) / rows.length; return Math.sqrt(rows.reduce((s, r) => s + (r.ret - m) ** 2, 0) / (rows.length - 1)); })();
  return {
    capital, rows, last, benchBase,
    s: {
      days: rows.length, winDays: wins.length, lossDays: losses.length, flatDays: flats.length,
      winRate: decided ? wins.length / decided : null, totalProfit, totalLoss,
      profitFactor: totalLoss < 0 ? totalProfit / -totalLoss : (totalProfit > 0 ? Infinity : null),
      avgWin, avgLoss, payoff: avgWin != null && avgLoss != null ? avgWin / -avgLoss : null,
      avgDaily: rows.length ? netPnl / rows.length : null, netPnl, grossPnl, cum: last ? last.cum : 0,
      benchCum: last ? last.bCum : null, maxDd, maxDdMoney, maxDdDate, curDd: last ? last.dd : 0, curDdMoney: last ? last.ddMoney : 0,
      retOverDd: maxDd < 0 && last ? last.cum / -maxDd : null, best, worst, curKind, cur, maxW, maxL, newHighs,
      totalCost, totalLots, costPerLot: totalLots ? totalCost / totalLots : null, deposits, withdrawals, vol,
      costShare: grossPnl > 0 ? totalCost / grossPnl : null, costOfCapital: capital ? totalCost / capital : null
    }
  };
}

/* ---------- 大盤（證交所加權指數，自動抓） ---------- */
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function syncBench() {
  const recs = view().records;
  if (!recs.length) return;
  const first = recs.map(r => r.date).sort()[0];
  const start = new Date(first + 'T00:00'); start.setDate(start.getDate() - 20);
  const end = new Date();
  const curYm = `${end.getFullYear()}${pad(end.getMonth() + 1)}`;
  const months = [];
  for (let d = new Date(start.getFullYear(), start.getMonth(), 1); d <= end; d.setMonth(d.getMonth() + 1)) months.push(`${d.getFullYear()}${pad(d.getMonth() + 1)}`);
  const todo = months.filter(ym => {
    const m = bench.months[ym];
    if (!m) return true;
    if (ym < curYm && m.final) return false;
    return Date.now() - (m.at || 0) > 20 * 60 * 1000;
  });
  if (!todo.length) { benchStatus = 'ok'; return; }
  benchStatus = 'loading'; renderBenchNote();
  let changed = false, failed = false;
  for (const ym of todo) {
    try {
      const res = await fetch(`https://www.twse.com.tw/rwd/zh/afterTrading/FMTQIK?date=${ym}01&response=json`, { cache: 'no-store' });
      const j = await res.json();
      if (j.stat === 'OK' && Array.isArray(j.data)) {
        j.data.forEach(row => {
          const [y, m, d] = String(row[0]).split('/');
          const close = parseFloat(String(row[4]).replace(/,/g, ''));
          if (isFinite(close)) bench.closes[`${+y + 1911}-${pad(m)}-${pad(d)}`] = close;
        });
      }
      bench.months[ym] = { at: Date.now(), final: ym < curYm };
      changed = true;
    } catch (e) { failed = true; }
    await sleep(350);
  }
  benchStatus = failed && !Object.keys(bench.closes).length ? 'fail' : (failed ? 'partial' : 'ok');
  if (changed) { save(BENCH_KEY, bench); render(); } else renderBenchNote();
}

/* ---------- charts（手刻 SVG，含滑鼠/手指十字線） ---------- */
function niceTicks(min, max, n = 4) {
  if (!isFinite(min) || !isFinite(max)) { min = 0; max = 1; }
  if (min === max) { const p = Math.abs(min) * 0.05 || 1; min -= p; max += p; }
  const step0 = (max - min) / n, mag = 10 ** Math.floor(Math.log10(step0)), e = step0 / mag;
  const step = (e >= 7.5 ? 10 : e >= 3.5 ? 5 : e >= 1.5 ? 2 : 1) * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, ticks = [];
  for (let v = lo; v <= hi + step / 2; v += step) ticks.push(+v.toFixed(10));
  return { lo, hi, ticks };
}
function xLabelIdx(n, w) {
  const want = Math.max(2, Math.min(n, Math.floor(w / 70)));
  if (n <= want) return [...Array(n).keys()];
  const out = new Set([0, n - 1]);
  for (let k = 1; k < want - 1; k++) out.add(Math.round(k * (n - 1) / (want - 1)));
  return [...out].sort((a, b) => a - b);
}
/**

    tip: i => i === 0 ? tipHead('起點') + tipRow('兩邊都從', '0%') : tipHead(at(i).date) + tipRow('我的帳戶', sPct(at(i).cum), mine, tone(at(i).cum)) + tipRow('大盤', at(i).bCum == null ? '—' : sPct(at(i).bCum), bch, tone(at(i).bCum)) + (at(i).bCum != null ? tipRow('領先／落後', sPct(at(i).cum - at(i).bCum)) : '')
  });
  const L = C.last;
  $('#cumStats').innerHTML = `<span>我的帳戶 <b class="${tone(L.cum)}">${sPct(L.cum)}</b></span><span>大盤 <b class="${tone(L.bCum)}">${L.bCum == null ? '—' : sPct(L.bCum)}</b></span>${L.bCum != null ? `<span>${L.cum >= L.bCum ? '領先' : '落後'} <b>${Math.abs((L.cum - L.bCum) * 100).toFixed(2)} 個百分點</b></span>` : ''}`;
  // 3. 每日損益（金額／%）
  const isPct = dailyMode === 'pct';
  chart($('#cDaily'), {
    labels: rows.map(r => r.date), height: T(220), fmt: isPct ? pctAxis : compactAxis, aria: '每日損益長條圖',
    bars: { values: rows.map(r => isPct ? r.ret : r.pnl), colorOf: v => v > 0 ? upM : dnM },
    tip: i => tipHead(rows[i].date) + tipRow('損益', sMoney(rows[i].pnl) + ' 元', null, tone(rows[i].pnl)) + tipRow('報酬率', sPct(rows[i].ret), null, tone(rows[i].ret)) + (rows[i].bRet != null ? tipRow('大盤當天', sPct(rows[i].bRet), null, tone(rows[i].bRet)) : '') + (rows[i].cost ? tipRow('💸 成本', money(rows[i].cost)) : '') + (rows[i].note ? `<div style="margin-top:4px;color:var(--ink-2)">「${esc(rows[i].note)}」</div>` : '')
  });
  // 4. 每日損益折線
  chart($('#cDailyLine'), {
    labels: rows.map(r => r.date), height: T(170), zero: true, fmt: compactAxis, aria: '每日損益折線圖',
    series: [{ name: '每日損益', color: mine, values: rows.map(r => r.pnl), dots: rows.length <= 60, dotColor: v => v > 0 ? upM : v < 0 ? dnM : muted }],
    tip: i => tipHead(rows[i].date) + tipRow('損益', sMoney(rows[i].pnl), null, tone(rows[i].pnl)) + tipRow('報酬率', sPct(rows[i].ret), null, tone(rows[i].ret))
  });
  // 5. 回撤
  chart($('#cDd'), {
    labels, height: T(170), zero: true, fmt: pctAxis, aria: '回撤比較：我的帳戶實線、大盤虛線',
    series: [{ name: '我的帳戶', color: mine, values: [0, ...rows.map(r => r.dd)], area: true, areaFlip: true }, ...(hasB ? [{ name: '大盤', color: bch, dashed: true, values: [0, ...rows.map(r => r.bDd)] }] : [])],
    tip: i => i === 0 ? tipHead('起點') + tipRow('回撤', '0%') : tipHead(at(i).date) + tipRow('我的回撤', sPct(at(i).dd), mine, tone(at(i).dd)) + tipRow('金額', sMoney(at(i).ddMoney)) + tipRow('大盤回撤', at(i).bDd == null ? '—' : sPct(at(i).bDd), bch, tone(at(i).bDd))
  });
  const s = C.s, lastB = [...rows].reverse().find(r => r.bDd != null);
  $('#ddStats').innerHTML = `<span>我的最大回撤 <b class="${s.maxDd < 0 ? 'down' : ''}">${sPct(s.maxDd)}</b></span><span>大盤最大回撤 <b>${hasB ? sPct(Math.min(0, ...rows.filter(r => r.bDd != null).map(r => r.bDd))) : '—'}</b></span><span>目前 <b>${sPct(s.curDd)}</b></span>`;
}
function pctAxis(v) { const a = Math.abs(v * 100), t = (v * 100).toFixed(a === 0 ? 0 : a < 1 ? 2 : a < 10 ? 1 : 0); return (+t === 0 ? '0' : t) + '%'; }
function compactAxis(v) { const a = Math.abs(v); return a >= 10000 ? (v / 10000).toFixed(a % 10000 ? 1 : 0) + '萬' : nf0.format(v); }

function setTab(t) { curTab = t; render(); window.scrollTo(0, 0); playIntro(); }
function wire() {
  document.querySelectorAll('[data-chart-btn]').forEach(b => b.onclick = () => { curChart = b.dataset.chartBtn; render(); const c = document.querySelector(`[data-chart-btn="${curChart}"]`); if (c) c.scrollIntoView({ inline: 'center', block: 'nearest' }); window.scrollTo(0, 0); });

/* ---------- entry dialog ---------- */
const dlg = $('#entryDlg');
let flowKind = 'none', editing = null;
function prevEquityBefore(iso) {
  const st = view();
  const prev = st.records.filter(r => r.date < iso).sort((a, b) => b.date.localeCompare(a.date))[0];
  return prev ? prev.equity : Number(st.settings.capital) || 0;
}
function setFlow(kind) {
  flowKind = kind;
  dlg.querySelectorAll('[data-flow]').forEach(b => b.setAttribute('aria-pressed', b.dataset.flow === kind));
  $('#fFlow').classList.toggle('hidden', kind === 'none');
  updatePreview();
}
function openEntry(iso) {
  if (viewKey) { toast('觀看模式只能看，不能修改'); return; }
  if (demo) { toast('範例模式不能修改，先按「清除範例」開始記自己的'); return; }
  const date = iso || todayIso();
  fillEntry(date);
  $('#fErr').textContent = '';
  dlg.showModal();
  setTimeout(() => $('#fEquity').focus(), 50);
}
function fillEntry(date) {
  const r = state.records.find(x => x.date === date);
  editing = r ? date : null;
  $('#entryTitle').textContent = r ? `修改 ${md(date)} 的紀錄` : '記錄今天';
  $('#fDate').value = date;
  $('#fEquity').value = r ? r.equity : '';
  const f = r ? Number(r.flow) || 0 : 0;
  $('#fFlow').value = f ? Math.abs(f) : '';
  $('#fCost').value = r && r.cost ? r.cost : '';
  $('#fLots').value = r && r.lots ? r.lots : '';
  $('#fNote').value = r ? r.note || '' : '';
  $('#fMore').open = !!(r && (r.cost || r.lots || r.note));
  $('#fDelete').classList.toggle('hidden', !r);
  setFlow(f > 0 ? 'in' : f < 0 ? 'out' : 'none');
}
function readFlow() { const v = Number($('#fFlow').value) || 0; return flowKind === 'in' ? v : flowKind === 'out' ? -v : 0; }
function updatePreview() {
  const eq = Number($('#fEquity').value), date = $('#fDate').value;
  syncDateChips();
  if (date) { const pr = view().records.filter(r => r.date < date).sort((a, b) => b.date.localeCompare(a.date))[0]; $('#fLastHint').textContent = pr ? `　上一筆 ${money(pr.equity)}（${md(pr.date)}）` : `　本金 ${money(view().settings.capital)}`; }
  const p = $('#fPreview');
  if (!$('#fEquity').value || !isFinite(eq) || !date) { p.innerHTML = '輸入權益總值後，這裡會算出今天的損益。'; return; }
  const prev = prevEquityBefore(date), flow = readFlow(), pnl = eq - prev - flow, base = prev + flow;
  const ret = base > 0 ? pnl / base : 0, first = !view().records.some(r => r.date < date);
  p.innerHTML = `今天損益 <b class="${tone(pnl)}">${arrow(pnl)} ${sMoney(pnl)} 元（${sPct(ret)}）</b><br><span class="muted" style="font-size:12.5px">＝ ${money(eq)} − ${first ? '本金' : '前一筆'} ${money(prev)}${flow ? ` − ${flow > 0 ? '入金' : '出金'} ${sMoney(flow)}` : ''}</span>` +
    (first && flow > 0 ? `<br><span class="up" style="font-size:12.5px">⚠️ 第一筆：本金 ${money(prev)} 如果已經包含今天入的錢，這裡請選「沒有」，不然會重複扣掉、變成假虧損。</span>`
      : Math.abs(ret) > 0.5 ? `<br><span class="up" style="font-size:12.5px">⚠️ 變動超過 50%，確認一下有沒有打錯、或忘了填入出金？</span>` : '');
}
['#fEquity', '#fFlow', '#fDate'].forEach(s => $(s).addEventListener('input', updatePreview));
$('#fDate').addEventListener('change', () => {
  const d = $('#fDate').value;
  // 換到有紀錄的日子 → 載入那天；從「修改某天」換到空白日子 → 改成新增，避免存檔時把原本那天刪掉
  if (d && d !== editing && (editing || state.records.some(r => r.date === d))) fillEntry(d); else updatePreview();
});
dlg.querySelectorAll('[data-flow]').forEach(b => b.addEventListener('click', () => { setFlow(b.dataset.flow); if (b.dataset.flow !== 'none') $('#fFlow').focus(); }));
$('#fCancel').onclick = () => dlg.close();
$('#fClose').onclick = () => dlg.close();
function prevTradingDay() { const d = new Date(); do { d.setDate(d.getDate() - 1); } while (d.getDay() === 0 || d.getDay() === 6); return isoOf(d); }
function syncDateChips() { const v = $('#fDate').value; dlg.querySelectorAll('[data-day]').forEach(b => b.setAttribute('aria-pressed', (b.dataset.day === 'today' ? todayIso() : prevTradingDay()) === v)); }

$('#fDelete').onclick = () => {

  state.records = state.records.filter(r => r.date !== editing); persist(); delArmed = false; $('#fDelete').textContent = '刪除這天';

$('#entryForm').addEventListener('submit', ev => {
  ev.preventDefault();

  if (!$('#fEquity').value || !isFinite(eq) || eq < 0) return ($('#fErr').textContent = '請輸入權益總值（APP 上的數字）');
  if (flowKind !== 'none' && !(Number($('#fFlow').value) > 0)) return ($('#fErr').textContent = '請輸入入金／出金的金額，或選「沒有」');

function download(name, text, type) {

/* ---------- 範例資料 ---------- */
function makeDemo() {
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const gauss = () => { let u = 0, v = 0; while (!u) u = rnd(); while (!v) v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  const days = []; const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - 1);
  while (days.length < 48) { if (d.getDay() % 6) days.unshift(isoOf(d)); d.setDate(d.getDate() - 1); }
  let eq = CAPITAL0; const notes = { 3: '第一次用停損單，有照做', 9: '追高被巴，下次等回測', 17: '連賠三天，今天休息只看盤', 24: '入金一萬，口數不加', 31: '順勢抱單，賺最多的一天', 40: '手癢多做了幾趟，手續費好痛' };
  const records = days.map((date, i) => {
    const flow = i === 24 ? 10000 : 0;
    const lots = rnd() < 0.18 ? 0 : 1 + Math.floor(rnd() * (i === 40 ? 12 : 5));
    const cost = lots * 32;
    const drift = i > 12 && i < 20 ? -240 : 170;
    const gross = lots ? Math.round(drift + gauss() * 520 + (i === 31 ? 2400 : 0)) : 0;
    eq = Math.round(eq + flow + gross - cost);
    return { date, equity: eq, flow, cost, lots, note: notes[i] || '' };
  });
  return { settings: { name: '範例', capital: CAPITAL0 }, records, lastBackup: Date.now() };
}
